<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오사카·교토 맛집 지도</title>
<meta name="description" content="유튜브 댓글 추천 맛집과 우리가 고른 가게, 숙소, 관광지를 한 지도에서 보고 숙소별 순위 맛집까지의 거리·시간을 확인하는 여행 지도">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --ink:#1d1b18; --ink2:#5d5850; --ink3:#8f887d; --line:#e7e2d9;
  --food:#e0452b; --food-soft:#fdece8; --hotel:#2456d6; --hotel-soft:#e8eefc; --walk:#11875d; --walk-soft:#e3f4ec; --spot:#0b8043; --spot-soft:#e2f3e8;
  --r1:#e0452b; --r2:#f08c00; --r3:#e2b100;
  --pin-food:#e5251e; --pin-food-d:#9e1410; --pin-hotel:#ffc400; --pin-hotel-d:#a87b00; --pin-spot:#9dff00; --pin-spot-d:#4f8a00;
  --accent:#1d1b18; --brand:#7c4dff; --brand-d:#6a3df0; --brand-soft:#f1ecff; --warn:#9a5b00; --warn-soft:#fff4dc; --radius:14px; --shadow:0 6px 24px rgba(29,27,24,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:var(--w1,420px) minmax(0,1fr);height:100dvh}
.side,.mapwrap{min-width:0}
.side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0;z-index:2}
/* PC: 장소를 고르면 목록 오른쪽에 상세 사이드 섹션 */
.app.has-detail{grid-template-columns:var(--w1,420px) var(--w2,400px) minmax(0,1fr)}
/* PC: 목록·상세 섹션 오른쪽 끝을 마우스로 끌어 가로폭 조절 */
.pane-rs{display:none}
@media (min-width:861px){
  .side{position:relative}
  .pane-rs{display:block;position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:6;touch-action:none}
  .pane-rs::after{content:'';position:absolute;top:0;bottom:0;left:4px;width:2px;background:transparent;transition:background .15s}
  .pane-rs:hover::after,.pane-rs.on::after{background:var(--brand)}
  body.rs-drag{cursor:col-resize;user-select:none}
  body.rs-drag iframe,body.rs-drag #gmap{pointer-events:none}
}
.side2{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0;min-width:0;z-index:2;position:relative}
.side2[hidden]{display:none}
.d2-head{position:absolute;top:10px;right:10px;z-index:3}
.d2-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink2);padding:0}
.d2-close:hover{border-color:var(--ink);color:var(--ink)}
.d2-body{overflow-y:auto;flex:1;min-height:0;padding:18px 18px 40px}
.side2,.d2-body,.d2-body .card,.d2-body .card.sel{background:#fff!important}
/* 얇은 스크롤바 (화살표 없음) */
.scroll::-webkit-scrollbar,.d2-body::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-track,.d2-body::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb,.d2-body::-webkit-scrollbar-thumb{background:rgba(29,27,24,.18);border-radius:6px}
.scroll::-webkit-scrollbar-thumb:hover,.d2-body::-webkit-scrollbar-thumb:hover{background:rgba(29,27,24,.35)}
.scroll::-webkit-scrollbar-button,.d2-body::-webkit-scrollbar-button{display:none;width:0;height:0}
@supports not selector(::-webkit-scrollbar){ .scroll,.d2-body{scrollbar-width:thin;scrollbar-color:rgba(29,27,24,.22) transparent} }
.d2-body .card{border:0;border-radius:0;box-shadow:none!important;padding:0 40px 0 0;margin:0;cursor:default}
.d2-body .card .detail{padding-right:0;margin-right:-40px}
@media (min-width:861px){ #list .card.sel .detail{display:none} }
@media (max-width:860px){ .side2{display:none!important} .app.has-detail{grid-template-columns:minmax(0,1fr)} }
.side-head{padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{font-size:12.5px;color:var(--ink3);margin:4px 0 0}
.legend{display:flex;gap:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.food{background:#fff;border:2px solid var(--food)} .dot.hotel{background:var(--hotel);border-radius:3px}
.dot.r1{background:var(--r1)} .dot.r2{background:var(--r2)} .dot.r3{background:var(--r3)}
.dot.spot{background:var(--spot)} .dot.zone{background:rgba(124,77,255,.22);border:1px solid #7c4dff;border-radius:3px}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-selected=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroll{--sx:14px;overflow-y:auto;flex:1;min-height:0;padding:12px var(--sx) 40px}
.sheet-handle{display:none}
.scroll.sheet-drag{user-select:none;cursor:grabbing}
#selSlot:empty{display:none}
.sel-label{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:2px 4px 8px}
#selSlot{margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
#selSlot .card{border:0;border-radius:0;box-shadow:none;background:none;padding:2px 2px 0;margin:0;cursor:default}
#selSlot .card-top{cursor:pointer}
.sel-bar{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.sel-back{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer}
.sel-back:hover,.sel-bar .d2-close:hover{border-color:var(--ink)}

/* route box */
.routebox{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0 calc(-1 * var(--sx)) 14px;padding:4px var(--sx) 18px}
.rb-title{font-size:14px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.rb-row{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px;margin-bottom:6px}
.rb-row label{font-size:12px;font-weight:700;color:var(--ink2)}
.rb-row select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.rb-actions{display:flex;gap:6px}
.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover:not(:disabled){background:var(--brand-d);border-color:var(--brand-d)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.book{background:#1a73e8;color:#fff;border-color:#1a73e8}
.result{margin-top:10px}
.modes{display:flex;gap:6px;margin-bottom:8px}
.mode{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.mode[aria-pressed=true]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.mode b{display:block;font-size:17px}
.mode small{font-size:11.5px;color:var(--ink3)}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.step:last-child{border-bottom:0}
.step .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--walk-soft)}
.meta{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.alts{margin-top:8px;font-size:12.5px;color:var(--ink2)}
.alts li{margin:3px 0}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* list */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px calc(-1 * var(--sx)) 0;padding:2px var(--sx) 4px}
.cats::-webkit-scrollbar{display:none}
@media (pointer:fine){.cats{cursor:grab;user-select:none}.cats.dragging,.cats.dragging .cat{cursor:grabbing}}
.cat{flex:none;padding:6px 13px;border-radius:999px;border:1px solid #e9e9e9;background:#fff;color:var(--ink3);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.cat b{font-weight:700;margin-left:3px;opacity:.55;font-size:11px}
.cat[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.cat[aria-pressed=true] b{opacity:.8}
.sec{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:16px 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow)}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow)}
.card-top{display:flex;gap:10px;align-items:flex-start;position:relative;width:100%;box-sizing:border-box}
.card-main{flex:1;min-width:0}
.ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--pin-food);box-shadow:inset 0 0 0 7px var(--pin-food),inset 0 0 0 40px #fff}
.card.hotel .ico{background:var(--pin-hotel);box-shadow:inset 0 0 0 7px var(--pin-hotel),inset 0 0 0 40px #fff}
.card.hotel .ico span{color:#5a4300!important}
.card.cand .ico{background:#fff;border:2px dashed var(--food)}
.card.spot .ico{background:var(--pin-spot);box-shadow:inset 0 0 0 7px var(--pin-spot),inset 0 0 0 40px #fff}
.nm{font-weight:800;font-size:15px;line-height:1.3}
.ja{font-size:12px;color:var(--ink3);margin-top:2px}
.area{font-size:12px;color:var(--ink2);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--food-soft);color:var(--food);margin-right:4px}
.area{display:flex;align-items:center;flex-wrap:wrap;column-gap:0}
.area .area-t{min-width:0}
.area .flag{position:absolute;right:0;bottom:2px;padding-left:8px;font-size:11px;font-weight:700;color:var(--food);white-space:nowrap}
.tag.hotel{background:var(--hotel-soft);color:var(--hotel)}
.tag.spot{background:var(--spot-soft);color:var(--spot)}
.rk{position:relative;display:inline-block!important;width:22px;height:22px;flex:none;border-radius:50%;font-size:0!important;color:transparent;padding:0;vertical-align:-6px;border:1.5px solid transparent;box-sizing:border-box;overflow:hidden}
.rk::after{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;line-height:1;color:initial}
.rk.r1::after{content:'👑'} .rk.r2::after{content:'🥈'} .rk.r3::after{content:'🥉'}
.rk.r1{background:#f2c200;border-color:#f2c200} .rk.r2{background:#a9b4bf;border-color:#a9b4bf} .rk.r3{background:#c47f45;border-color:#c47f45}
.rankset{flex:none;display:flex;gap:3px}
.rankset button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0;filter:grayscale(1);opacity:.45}
.rankset button[aria-pressed=true]{filter:none;opacity:1}
.rankset button[aria-pressed=true].r1{background:#f2c200;border-color:#f2c200}
.rankset button[aria-pressed=true].r2{background:#a9b4bf;border-color:#a9b4bf}
.rankset button[aria-pressed=true].r3{background:#c47f45;border-color:#c47f45}
.credit{font-size:11px;color:var(--ink3);margin:18px 2px 0;line-height:1.5}
.detail{display:none;margin-top:10px;font-size:13.5px}
.detail>.dsec.d-loc{margin-top:6px}
.card.sel .detail{display:block}
.tip{background:#fff6dc;border:1px solid #f1d27a;border-radius:10px;padding:9px 11px;line-height:1.55;font-size:13.5px;margin:8px 0}
.quote{background:var(--bg);border-radius:10px;padding:9px 11px;white-space:pre-line;line-height:1.55;font-size:13.5px}
.quote-h{font-size:11.5px;font-weight:700;color:var(--ink3);margin:0 0 4px}
.facts{margin:8px 0 0;padding-left:16px;color:var(--ink2);font-size:12.5px;line-height:1.55}
.addr{font-size:12px;color:var(--ink3);margin-top:8px}
table.near{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;table-layout:fixed}
table.near th:nth-child(1){width:46%} table.near th:nth-child(2){width:20%}
table.near td{overflow-wrap:anywhere;word-break:keep-all}
table.near th{font-size:11px;color:var(--ink3);text-align:left;font-weight:700;padding:4px}
table.near td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
table.near td.n{font-weight:700}
table.near tr[data-route]{cursor:pointer} table.near a.gtr{font-size:12px;font-weight:700;color:#1a56c4;text-decoration:none;white-space:nowrap}
table.near tr[data-route]:hover td{background:var(--bg)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink2);font-size:13.5px;line-height:1.6;background:#fff}

/* google place info */
.gp{margin:10px 0 2px}
.gp-slider{position:relative}
.gp-ph:empty{display:none}
.gp-ph{margin:2px 0 10px}
.gp-photos figure{position:relative}
.mph-tag{position:absolute;left:6px;top:6px;max-width:calc(100% - 12px);background:rgba(20,18,15,.72);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msum{display:flex;align-items:center;gap:6px;margin-top:6px;min-width:0;font-size:12px}
.msum-m{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rsv{flex:none;display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.rsv.r-req{background:#ffe3e1;color:#c4231b} .rsv.r-rec{background:#fff0d6;color:#b25e00} .rsv.r-ok{background:#e3f6e8;color:#1b7a3a} .rsv.r-no{background:#eeeae4;color:#5d5850} .rsv.r-unk{background:#f1ecff;color:var(--brand-d)}
.mlist{margin:6px 0 4px;padding:0;list-style:none;counter-reset:m}
.mlist li{counter-increment:m;position:relative;padding:7px 0 7px 26px;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist li::before{content:counter(m);position:absolute;left:0;top:8px;width:18px;height:18px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.ml-n{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.ml-p{color:var(--ink2);font-weight:700;font-size:12.5px;white-space:nowrap}
.ml-ja{font-size:11.5px;color:var(--ink3)}
.ml-d{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.rbox2{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:6px 0}
.rb2-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rb2-note{font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:6px}
.rb2-mn{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:3px}
.rbox2 .links{margin-top:8px}
.msrc{margin:6px 0 2px;font-size:12px;color:var(--ink3)} .msrc summary{cursor:pointer} .msrc ul{margin:4px 0;padding-left:18px} .msrc a{color:var(--ink2);word-break:break-all}
.gp-photos{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;padding-bottom:2px}
.gp-photos::-webkit-scrollbar{display:none}
.gp-nav{position:absolute;top:75px;transform:translateY(-50%);z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer;padding:0;transition:opacity .15s}
.gp-nav.prev{left:6px} .gp-nav.next{right:6px}
.gp-nav:hover{background:#fff;color:var(--brand)}
.gp-nav:disabled{opacity:0;pointer-events:none}
@media (max-width:860px),(hover:none){ .gp-nav{display:none} }
.gp-photos figure{margin:0;flex:none;width:220px;scroll-snap-align:start}
.gp-photos img{width:220px;height:150px;object-fit:cover;border-radius:10px;background:var(--bg);display:block}
.gp-photos figcaption{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-photos figcaption a{color:inherit}
.gp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:6px}
/* 상세 섹션 (슬라이더 아래) */
.d-sum{display:flex;align-items:center;gap:8px;margin-top:12px}
.d-rate{display:inline-flex;align-items:baseline;gap:6px;font-size:17px;font-weight:800;color:var(--ink)}
.d-rate{color:#e8a400} .d-rate .d-cnt{font-size:12px;font-weight:600;color:var(--ink3)}
.d-open{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.d-open.on{background:#e3f6e8;color:#1b7a3a} .d-open.off{background:#ffe3e1;color:#c4231b}
.d-hours{margin-top:8px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.d-hours summary{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none}
.d-hours summary::-webkit-details-marker{display:none}
.d-hours summary::after{content:'';margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
.d-hours[open] summary::after{transform:rotate(-135deg)}
.d-k{color:var(--ink3);font-weight:700;font-size:12px;flex:none} .d-v{font-weight:700;color:var(--ink);min-width:0}
.d-hours ul{margin:0;padding:2px 12px 10px 12px;list-style:none;line-height:1.75;color:var(--ink2);font-size:12.5px}
.d-hours li.today{color:var(--ink);font-weight:800}
.d-acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:10px}
.d-act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;background:#fff;transition:border-color .15s,background .15s}
.d-act span{font-size:18px;line-height:1} .d-act:hover{border-color:var(--brand);background:var(--brand-soft)}
.gp-src{font-size:10.5px;color:var(--ink3);margin-top:6px}
.dsec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.dsec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:15px;font-weight:800;color:var(--ink)}
.dsec-s{font-size:11.5px;font-weight:600;color:var(--ink3)}
.dsec .quote-h{font-size:12px;color:var(--ink2);margin:10px 0 5px}
.dsec .quote-h:first-of-type{margin-top:0}
.dsec .quote{font-size:13.5px;line-height:1.65;margin-bottom:6px}
.whymenu{font-size:13px;color:var(--ink2);margin:8px 0 0} .whymenu b{color:var(--ink)}
.dsec .facts{font-size:13px;line-height:1.65}

function cleanRoute(r){ // 캐시·응답 값 검증: 숫자 필드는 숫자만, 문자열은 화면에서 esc 처리

  let h2='<div class="ranksum">';
  for(const r of [1,2,3]){ const fs=foods.filter(q=>rankOf(q)===r);
    if(!fs.length){ h2+=`<div>${r}순위<b>—</b></div>`; continue; }
    const keys=fs.map(q=>`${h.id}|${q.id}`);
    const done = k => WALK[k] && TR[k] && TR[k].status!=='loading';   // 도보·지하철 둘 다 결과가 나온 가게만 '빠른 방법' 평균에
    const bs=keys.filter(done).map(k=>{ const w=WALK[k], t=trMin(k); const c=[w&&Number.isFinite(w.min)?w.min:null, t].filter(Number.isFinite); return c.length?Math.min(...c):null; }).filter(Number.isFinite);

      const wOK=w&&Number.isFinite(w.min), tOK=t&&!t.walkOnly&&Number.isFinite(t.min);

      if(useT){ const segs=transitSegs(k); if(segs){ drawSegs(segs,RANK_COLOR[r],wt,lab); return; } prepTransit(h,q,k).then(redraw); }
      addLine(h,q,RANK_COLOR[r], wt, lab, HPATH[k]); });

}

function nearTable(p){

  if(!others.length) return '';

    const a = p.type==='hotel' ? p : q, b = p.type==='hotel' ? q : p, k=`${a.id}|${b.id}`;
    const w = WALK[k], wm = w&&Number.isFinite(w.min)?w.min:null, tm = trMin(k);
    const best = [wm,tm].filter(Number.isFinite); const sortKey = best.length?Math.min(...best):1e9;

window.addEventListener('pointerup',()=>{ if(!catDrag) return; if(catDrag.moved){ catSuppress=true; catDrag.c.classList.remove('dragging'); setTimeout(()=>catSuppress=false,0); } catDrag=null; });
listEl.addEventListener('click',e=>{ if(catSuppress && e.target.closest('.cats')){ e.stopPropagation(); e.preventDefault(); catSuppress=false; } },true);
listEl.addEventListener('wheel',e=>{ const c=e.target.closest('.cats'); if(!c||Math.abs(e.deltaX)>Math.abs(e.deltaY)) return; if(c.scrollWidth<=c.clientWidth) return; c.scrollLeft+=e.deltaY; e.preventDefault(); },{passive:false});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-gpnav]'); if(!b) return;
  e.stopPropagation(); e.preventDefault();
  const sc=b.parentElement.querySelector('.gp-photos'), fig=sc.querySelector('figure');
  const step=fig?fig.getBoundingClientRect().width+6:220; sc.scrollBy({left:+b.dataset.gpnav*step,behavior:'smooth'});
},true);
const gpNavSync=sc=>{ const w=sc.parentElement; if(!w||!w.classList.contains('gp-slider')) return;
  const pv=w.querySelector('.prev'), nx=w.querySelector('.next'), max=sc.scrollWidth-sc.clientWidth-2;

document.addEventListener('scroll',e=>{ if(e.target.classList&&e.target.classList.contains('gp-photos')) gpNavSync(e.target); },true);
new MutationObserver(()=>document.querySelectorAll('.gp-photos').forEach(gpNavSync)).observe(document.body,{childList:true,subtree:true});
const onListClick=e=>{
  const ct=e.target.closest('[data-cat]'); if(ct){ state.cat=ct.dataset.cat; renderList(); refreshMarkers(); return; }
  const rk=e.target.closest('[data-rank]'); if(rk){ e.stopPropagation(); setRank(rk.dataset.id, +rk.dataset.rank); return; }
  const sf=e.target.closest('[data-setfrom]'), st=e.target.closest('[data-setto]'), tr=e.target.closest('tr[data-route]');
  if(sf){ e.stopPropagation(); setRoute(sf.dataset.setfrom, state.to); return; }
  if(st){ e.stopPropagation(); setRoute(state.from, st.dataset.setto); return; }
  if(tr && !e.target.closest('a.gtr')){ e.stopPropagation(); const [a,b]=tr.dataset.route.split('|'); setRoute(a,b); return; }
  if(e.target.closest('a,details')) return;
  if(e.currentTarget===detailPane){ if(e.target.closest('[data-close]')) select(null,false); return; }
  // 모바일 선택 카드: '목록으로'·접기 버튼이나 카드 윗부분(이름·사진)을 누르면 접고 목록으로. 상세 내용 클릭으로는 안 접힘
  if(e.target.closest('#selSlot')){ if(e.target.closest('[data-close]')||e.target.closest('#selSlot .card-top')){ select(null,false); sheetEl.scrollTo({top:0}); } return; }
  const c=e.target.closest('.card'); if(c) select(c.dataset.id===state.sel?null:c.dataset.id,false);
};
sheetEl.addEventListener('click',onListClick); detailPane.addEventListener('click',onListClick);

function select(id, fromMap){
  state.sel=id; if(id && fromMap && window.openSheet) openSheet();
  if(id && byId[id].city!==state.city){ setCity(byId[id].city, true); }
  renderList(); refreshMarkers();
  if(!id){ clearOverlays(); renderBar(); return; }
  const p=byId[id];
  if(view.kind==='embed') showEmbed(null);
  if(!(state.from&&state.to)) clearOverlays();
  loadPlace(p);
  if(p.type==='hotel') showHotelRanks(p);
  else {
    if(!(state.from&&state.to)) panTo(p.lat,p.lng,16);
    if(p.type==='food'){ const hs=P.filter(q=>q.type==='hotel'&&q.city===p.city);
      const up=()=>{ if(state.sel===p.id) document.querySelectorAll(`[data-near="${p.id}"]`).forEach(tb=>tb.innerHTML=nearTable(p)); };
      if(hs.length){ walkMatrix(hs,[p]).then(up); hs.forEach(h=>transitQuery(h,p).then(up)); } }
  }
  renderBar();
  if(mobSheet()) sheetEl.scrollTo({top:0,behavior:'smooth'});
  else { const el=sheetEl.querySelector(`[data-id="${id}"]`); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

/* ---------- city / filter ---------- */
function setCity(c, keepRoute){
  state.city=c;
  if(!keepRoute){ const a=byId[state.from], b=byId[state.to]; if((a&&a.city!==c)||(b&&b.city!==c)) setRoute('',''); }
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.city===c)); if(typeof updCtl==='function') updCtl();
  renderList(); refreshMarkers();
  if(!keepRoute && !(state.from&&state.to)){ clearOverlays(); renderBar(); panTo(CITY[c].center[0], CITY[c].center[1], CITY[c].zoom); }
}
const CTLS=[...document.querySelectorAll('.ctlgrp .ctl')];
function setOpen(ctl,o){ ctl.classList.toggle('open',o); ctl.querySelector('.ctlbtn').setAttribute('aria-expanded',o); }
function updCtl(){ const c=document.querySelector('.tab[aria-selected=true]'), fs=[...document.querySelectorAll('.chip[aria-pressed=true]')].filter(x=>x.dataset.filter!=='all');
  document.querySelector('#cityCtl .ctlv').textContent=c?c.textContent:''; document.querySelector('#typeCtl .ctlv').textContent=fs.length?fs.map(x=>x.textContent).join(', '):'전체'; }
CTLS.forEach(ctl=>{
  ctl.querySelector('.ctlbtn').onclick=()=>{ const o=!ctl.classList.contains('open'); CTLS.forEach(x=>setOpen(x,false)); setOpen(ctl,o); };
  ctl.querySelector('.ctlpanel').addEventListener('click',e=>{ if(e.target.closest('.tab')) setTimeout(()=>{ updCtl(); setOpen(ctl,false); }); else if(e.target.closest('.chip')) setTimeout(updCtl); });
});
document.addEventListener('click',e=>{ CTLS.forEach(x=>{ if(!x.contains(e.target)) setOpen(x,false); }); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') CTLS.forEach(x=>{ if(x.classList.contains('open')){ setOpen(x,false); x.querySelector('.ctlbtn').focus(); } }); });
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ state.sel=null; if(view.kind==='embed') showEmbed(null); setCity(t.dataset.city); });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const v=c.dataset.filter, T=state.types;
  if(v==='all') T.clear(); else if(T.has(v)) T.delete(v); else T.add(v);
  if(T.size===4) T.clear(); // 다 고르면 = 전체
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.filter==='all' ? !T.size : T.has(x.dataset.filter)));
  renderList(); refreshMarkers(); });

const fromSel=document.getElementById('from'), toSel=document.getElementById('to'), resEl=document.getElementById('result');

  const opt = p=>`<option value="${p.id}">${p.type==='hotel'?'🛏 ':(p.emoji||'')+' '}${esc(p.name)}</option>`;
  let h='<option value="">선택하세요</option>';
  for(const c of ['osaka','kyoto','nara']){
    const hs=P.filter(p=>p.city===c&&p.type==='hotel'), fs=P.filter(p=>p.city===c&&p.type==='food'), ss=P.filter(p=>p.city===c&&p.type==='spot');
    if(hs.length) h+=`<optgroup label="${CITY[c].name} · 숙소">${hs.map(opt).join('')}</optgroup>`;
    if(fs.length) h+=`<optgroup label="${CITY[c].name} · 맛집">${fs.map(opt).join('')}</optgroup>`;
    if(ss.length) h+=`<optgroup label="${CITY[c].name} · 관광지">${ss.map(opt).join('')}</optgroup>`;

}

(function(){
  const boxes=[...document.querySelectorAll('.rbox')];
  const close=()=>boxes.forEach(b=>{ b.classList.remove('open'); const p=b.querySelector('.rpanel'); if(p) p.remove(); });
  function open(box){ const sel=box.querySelector('select'); close();
    if(typeof CTLS!=='undefined') CTLS.forEach(x=>setOpen(x,false));
    const pn=document.createElement('div'); pn.className='rpanel'; pn.setAttribute('role','listbox');
    pn.innerHTML=`<input class="rp-search" type="search" placeholder="장소 검색" aria-label="장소 검색" autocomplete="off"><div class="rp-list"></div>`;
    box.appendChild(pn); box.classList.add('open');
    const list=pn.querySelector('.rp-list'), q=pn.querySelector('.rp-search');
    const draw=()=>{ const k=q.value.trim().toLowerCase(); let h='';
      if(sel.value && !k) h+=`<button type="button" class="rp-o rp-clear" data-v=""><span class="e">✕</span><span class="t">선택 해제</span></button>`;
      [...sel.children].forEach(g=>{ if(g.tagName!=='OPTGROUP') return;
        const os=[...g.children].filter(o=>!k||o.textContent.toLowerCase().includes(k)); if(!os.length) return;
        h+=`<div class="rp-g">${esc(g.label)}</div>`+os.map(o=>{ const t=o.textContent.trim(), i=t.indexOf(' '), e=i>0?t.slice(0,i):'', n=i>0?t.slice(i+1):t;
          return `<button type="button" class="rp-o" role="option" data-v="${esc(o.value)}" aria-selected="${o.value===sel.value}"><span class="e">${esc(e?e.replace(/️/g,'')+'️':'')}</span><span class="t">${esc(n)}</span></button>`; }).join(''); });
      list.innerHTML=h||'<div class="rp-empty">검색 결과가 없어요</div>'; };
    draw(); q.addEventListener('input',draw);
    const cur=list.querySelector('[aria-selected=true]'); if(cur) list.scrollTop=cur.offsetTop-list.clientHeight/2;
    requestAnimationFrame(()=>pn.scrollIntoView({block:'nearest',behavior:'smooth'}));
    if(matchMedia('(pointer:fine)').matches) q.focus({preventScroll:true});
    pn.addEventListener('click',e=>{ e.stopPropagation(); const o=e.target.closest('.rp-o'); if(!o) return;
      sel.value=o.dataset.v; close(); sel.dispatchEvent(new Event('change')); });
    q.addEventListener('keydown',e=>{ const os=[...list.querySelectorAll('.rp-o')]; let i=os.findIndex(x=>x.classList.contains('kb'));
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); os.forEach(x=>x.classList.remove('kb')); i=e.key==='ArrowDown'?Math.min(i+1,os.length-1):Math.max(i-1,0); if(os[i]){ os[i].classList.add('kb'); os[i].scrollIntoView({block:'nearest'}); } }
      else if(e.key==='Enter'){ e.preventDefault(); (os[i]||os[0])?.click(); }
      else if(e.key==='Escape'){ close(); box.focus(); } });
  }
  boxes.forEach(b=>{ b.tabIndex=0; b.querySelector('select').tabIndex=-1;
    b.addEventListener('click',e=>{ e.preventDefault(); if(e.target.closest('.rpanel')) return; if(b.classList.contains('open')) close(); else open(b); });
    b.addEventListener('keydown',e=>{ if(e.target!==b) return; if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); open(b); } }); });
  document.addEventListener('click',e=>{ if(!e.target.closest('.rbox')) close(); });

})();
document.getElementById('swap').onclick=()=>setRoute(state.to,state.from);
document.getElementById('clear').onclick=()=>setRoute('','');

function setRoute(a,b){
  state.from=a||''; state.to=b||''; state.mode=null;
  fromSel.value=state.from; toSel.value=state.to;
  const A=byId[state.from], B=byId[state.to];
  if(A&&B&&A.city===B.city&&A.city!==state.city){ state.city=A.city; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.city===A.city)); renderList(); }
  refreshMarkers();
  renderRoute();
  try{ history.replaceState(null,'', state.from||state.to ? `#from=${state.from}&to=${state.to}` : location.pathname); }catch(e){}
  if(a && b) document.getElementById('scroll').scrollTo({top:0,behavior:'smooth'});
}
async function renderRoute(){
  const a=byId[state.from], b=byId[state.to];
  if(!a||!b||a.id===b.id){
    if(view.kind==='embed') showEmbed(null);
    resEl.innerHTML = !a&&!b ? '' : a&&b ? '<p class="note">출발지와 도착지가 같아요.</p>' : '<p class="note">출발지와 도착지를 모두 고르세요. 숙소·가게 카드의 표 행을 눌러도 바로 경로가 나와요.</p>';
    newGen();
    if(state.sel && byId[state.sel].type==='hotel') showHotelRanks(byId[state.sel]);
    else { if(map) clearOverlays(); renderBar(); }
    return;
  }
  const seq=newGen(), k=`${a.id}|${b.id}`;
  if(view.kind==='embed') showEmbed(null);
  const decideAuto = ()=>{ if(!state.modeAuto) return; const w=WALK[k], wm=w&&Number.isFinite(w.min)?w.min:null, t=trBest(k);
    if(wm!=null && wm<=12) state.mode='walk';
    else if(t && !t.walkOnly && (wm==null || t.min<wm)) state.mode='transit';
    else if(wm!=null && t) state.mode='walk'; };
  if(!state.mode){ state.modeAuto=true; state.mode='transit'; state.alt=0; decideAuto(); }
  const links=`<div class="links"><a class="btn small primary" target="_blank" rel="noopener" href="${gdir(a,b,'transit')}">구글 지도 앱으로 지금 출발 (다음 열차·지연)</a><a class="btn small" target="_blank" rel="noopener" href="${gdir(a,b,'walking')}">도보 경로 열기</a></div>`;
  const draw = ()=>{
    if(seq!==gen) return;
    const w=WALK[k], t=TR[k], tb=t&&t.status==='ok'&&t.routes.length ? t.routes[Math.min(state.alt||0,t.routes.length-1)] : null;
    let h='<div class="modes">';
    h+=`<button class="mode" data-mode="walk" aria-pressed="${state.mode==='walk'}"><small>🚶 도보</small><b>${w&&Number.isFinite(w.min)?fmtMin(w.min):(w&&w.err?'—':'계산 중…')}</b><small>${w&&w.m?fmtDist(w.m):(w&&w.err?esc(w.err):'')}</small></button>`;
    h+=`<button class="mode" data-mode="transit" aria-pressed="${state.mode==='transit'}"><small>🚇 지하철+도보</small><b>${tb?(tb.walkOnly?'도보 추천':fmtMin(tb.min)):(t&&t.status==='error'?'—':'조회 중…')}</b><small>${tb&&!tb.walkOnly?(tb.fare!=null?'¥'+tb.fare.toLocaleString():'요금 미확인')+(tb.transfers?` · 환승 ${tb.transfers}`:''):(t&&t.status==='error'?trErrText(t.msg):'')}</small></button>`;
    h+='</div>';
    if(state.mode==='transit'){
      if(!t || t.status==='loading') h+='<p class="note">NAVITIME에서 경로를 찾는 중…</p>';
      else if(t.status==='error') h+=`<div class="warn">지하철 경로를 불러오지 못했어요 (${esc(t.msg)}). 아래 구글 지도 앱 버튼으로 확인하세요.</div>`;
      else {
        const rs=t.routes; const i=Math.min(state.alt||0, rs.length-1); const r=rs[i];
        if(rs.length>1) h+=`<div class="modes" style="flex-wrap:wrap">${rs.map((x,j)=>`<button class="mode" data-alt="${j}" aria-pressed="${j===i}" style="flex:1 1 30%"><small>경로 ${j+1}${x.walkOnly?' · 도보':''}</small><b style="font-size:15px">${fmtMin(x.min)}</b><small>${x.fare!=null?'¥'+x.fare.toLocaleString():(x.walkOnly?'요금 없음':'요금 미확인')}${x.transfers?` · 환승 ${x.transfers}`:''}</small></button>`).join('')}</div>`;
        if(r.longWalk) h+='<div class="warn" style="margin-bottom:8px">이 경로에 20분 넘게 걷는 구간이 있어요. NAVITIME 무료 API는 <b>버스를 넣지 않고</b> 계산해서, 실제로는 버스·택시·숙소 송영이 더 나을 수 있어요. 구글 지도 앱으로도 확인하세요.</div>';
        h+='<ol class="steps">'+r.steps.map((s,j)=>{
          if(s.kind==='walk') return `<li class="step"><span class="ic">🚶</span><div>${s.fromGate?`<b>${esc(s.fromGate)}</b>로 나와서 `:''}${esc(s.to==='도착지'?b.name:s.to)}${s.gate?` <b>${esc(s.gate)}</b>`:''}까지 걷기<div class="meta">${fmtMin(s.min)} · ${fmtDist(s.m)}</div></div></li>`;
          return `<li class="step"><span class="ic" style="background:${esc(s.color)}22">🚇</span><div><span class="badge" style="background:${esc(s.color)}">${lineLabel(s.line).replace(/<span class="meta">/,'<span style="opacity:.85;font-weight:500">')}</span><div style="margin-top:4px"><b>${esc(s.from)}</b>${s.fromNo?` <span class="meta">${esc(s.fromNo)}</span>`:''} 승차 → <b>${esc(s.to)}</b>${s.toNo?` <span class="meta">${esc(s.toNo)}</span>`:''} 하차</div><div class="meta">${fmtMin(s.min)}${s.dir?` · ${esc(s.dir)} 방면`:''}${s.type&&s.type!=='普通'?` · ${esc(s.type)}`:''}</div></div></li>`;
        }).join('')+'</ol>';
        h+=`<p class="note">총 ${fmtMin(r.min)} · 운임 ${r.fare!=null?'¥'+r.fare.toLocaleString():'미확인'}${r.ic!=null&&r.ic!==r.fare?` (IC카드 ¥${r.ic.toLocaleString()})`:''} · 걷는 거리 ${fmtDist(r.walkM)}<br>${t.src==='google' ? `출처: Google 지도 대중교통 길찾기 화면 (${esc(fmtAt(t.at))} 확인, 그 시각 시간표 기준).` : `출처: NAVITIME 경로 탐색 (${esc(fmtAt(t.at))} 조회). 철도 시간은 시간표가 아닌 <b>평균 소요시간</b> 기준이고 버스는 포함되지 않아요.`} 다음 열차 시각·지연은 아래 구글 지도 앱 버튼으로 확인하세요.</p>`;
      }
    } else if(w && Number.isFinite(w.min)){
      h+=`<ol class="steps"><li class="step"><span class="ic">🚶</span><div>${esc(b.name)}까지 걷기<div class="meta">${fmtMin(w.min)} · ${fmtDist(w.m)}</div></div></li></ol><p class="note">도보: Google Routes API 실시간 계산 (${esc(fmtAt(w.at))}). 지도에 초록 선으로 표시했어요.</p>`;
    } else if(w && w.err){ h+=`<div class="warn">도보 경로를 계산하지 못했어요 (${esc(w.err)}).</div>`; }
    h+=links;
    resEl.innerHTML=h;
    resEl.querySelectorAll('.mode[data-mode]').forEach(m=>m.onclick=()=>{ state.mode=m.dataset.mode; state.modeAuto=false; renderRoute(); });
    resEl.querySelectorAll('.mode[data-alt]').forEach(m=>m.onclick=()=>{ state.alt=+m.dataset.alt; state.modeAuto=false; draw(); drawMap(); });
  };
  const drawMap = async ()=>{
    if(seq!==gen || !map) return;
    const tok=++mapTok, mode=state.mode, ok=()=>seq===gen && tok===mapTok && state.mode===mode;
    if(state.mode==='walk'){
      try{ const v=await walkRoute(a,b); if(!ok()) return; draw();
        clearOverlays();
        const path = v.enc ? google.maps.geometry.encoding.decodePath(v.enc) : [{lat:a.lat,lng:a.lng},{lat:b.lat,lng:b.lng}];
        overlays.push(new google.maps.Polyline({map, path, strokeColor:'#11875d', strokeOpacity:.95, strokeWeight:5, zIndex:3}));
        const bb=new google.maps.LatLngBounds(); path.forEach(x=>bb.extend(x)); map.fitBounds(bb,60); renderBar();
      }catch(err){ if(!ok()) return; WALK[k]={err:String(err.message||err)}; draw(); }
      return;
    }
    await transitQuery(a,b,{shape:true}); if(!ok()) return; draw();
    clearOverlays();
    const shapes=TRSHAPE[k], i=Math.min(state.alt||0,((TR[k]&&TR[k].routes)||[1]).length-1), fc=shapes&&shapes[i];
    const bb=new google.maps.LatLngBounds(); bb.extend({lat:a.lat,lng:a.lng}); bb.extend({lat:b.lat,lng:b.lng});
    if(fc && Array.isArray(fc.features)){
      fc.features.forEach(f=>{ const g=f.geometry; if(!g) return; const lines = g.type==='LineString'?[g.coordinates]: g.type==='MultiLineString'?g.coordinates:[];
        const pr=f.properties||{}, walk=pr.ways==='walk', col=(pr.inline&&pr.inline.color)||'#555';
        lines.forEach(cs=>{ const path=cs.map(c=>({lat:c[1],lng:c[0]})); path.forEach(x=>bb.extend(x));
          overlays.push(walk ? new google.maps.Polyline({map, path, strokeOpacity:0, icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,strokeColor:'#11875d',strokeWeight:3,scale:2},offset:'0',repeat:'9px'}], zIndex:3})
                             : new google.maps.Polyline({map, path, strokeColor:col==='#D3D3D3'?'#555':col, strokeOpacity:.95, strokeWeight:6, zIndex:4})); }); });
    } else {
      const r=trBest(k) && TR[k].routes[i], ak=`${k}#${i}`, ap=APPROX[ak];
      if(ap && ap.segs){
        ap.segs.forEach(sg=>{ sg.path.forEach(x=>bb.extend(x));
          overlays.push(sg.ride ? new google.maps.Polyline({map, path:sg.path, strokeColor:sg.color==='#D3D3D3'?'#555':sg.color, strokeOpacity:.95, strokeWeight:6, zIndex:4})
                                : new google.maps.Polyline({map, path:sg.path, strokeOpacity:0, icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,strokeColor:'#11875d',strokeWeight:3,scale:2},offset:'0',repeat:'9px'}], zIndex:3})); });
      } else {
        overlays.push(new google.maps.Polyline({map, path:[{lat:a.lat,lng:a.lng},{lat:b.lat,lng:b.lng}], strokeColor:'#555', strokeOpacity:.25, strokeWeight:2}));
        if(r && !r.walkOnly && !(ap&&ap.failed)) buildApprox(ak,a,b,r).then(()=>{ if(seq===gen && APPROX[ak] && APPROX[ak].segs) drawMap(); });
      }
    }
    map.fitBounds(bb,60); renderBar();
  };
  draw();
  const after = ()=>{ if(seq!==gen) return; const before=state.mode; decideAuto(); if(state.mode!==before){ drawMap(); } draw(); };
  if(!WALK[k] || WALK[k].err) walkMatrix([a],[b]).then(after);
  transitQuery(a,b,{shape:true}).then(after);   // 경로+지도 도형을 한 번에 (요청 1회)
  drawMap();
}

  if(added.some(x=>x.gpid&&shipped.has(x.gpid))){ added=added.filter(x=>!(x.gpid&&shipped.has(x.gpid))); lsSet('added',added); }
  const E=lsGet('edits',{}), ov=p=>{ const e=E[p.id]; return e&&(e.type||e.group||e.emoji) ? Object.assign({},p,e) : p; };   // 변경 모달에서 바꾼 카테고리·필터
  P.length=0; BASE.forEach(p=>{ if(!removed.has(p.id)) P.push(ov(p)); }); added.forEach(p=>{ if(!removed.has(p.id)) P.push(ov(p)); });
  for(const k in byId) delete byId[k]; P.forEach(p=>byId[p.id]=p);

function openDeleteModal(){
  const removed0=new Set(lsGet('removed',[]));
  const staged=new Set();      // 이번에 삭제 표시한 것
  const restore=new Set();     // 이번에 복원 표시한 것 (예전에 지운 것)
  let tab='food';
  const all = ()=>[...BASE, ...lsGet('added',[])];
  const draw = ()=>{
    const live = all().filter(p=>p.type===tab && !removed0.has(p.id));
    const gone = all().filter(p=>p.type===tab && removed0.has(p.id));
    const cnt = staged.size + restore.size;
    const body = live.length ? live.map(p=>{ const on=staged.has(p.id);
        return `<div class="mrow${on?' gone':''}">${thumbOrIco(p)}<div class="mi"><div class="mn">${esc(p.name)}</div><div class="meta">${esc(CITY[p.city]?CITY[p.city].name:'')} · ${esc(p.area||p.address||'')}</div></div>${on?`<button class="minus undo" data-undo="${esc(p.id)}">되돌리기</button>`:`<button class="minus" data-del="${esc(p.id)}" aria-label="${esc(p.name)} 삭제" title="삭제">−</button>`}</div>`; }).join('')
      : `<div class="empty">${TYPE_LABEL[tab]}이(가) 없어요.</div>`;
    const goneHTML = gone.length ? `<div class="sub-h">삭제한 ${TYPE_LABEL[tab]} ${gone.length}</div>`+gone.map(p=>{ const on=restore.has(p.id);
        return `<div class="mrow${on?'':' gone'}">${thumbOrIco(p)}<div class="mi"><div class="mn">${esc(p.name)}</div><div class="meta">${on?'저장하면 다시 표시돼요':'삭제됨'}</div></div>${on?`<button class="minus undo" data-unrestore="${esc(p.id)}">취소</button>`:`<button class="plus" data-restore="${esc(p.id)}" aria-label="${esc(p.name)} 복원" title="복원">+</button>`}</div>`; }).join('') : '';
    modalEl.querySelector('.modal').innerHTML = `
      <div class="modal-h">${modeTabs('del')}<h2>장소 삭제</h2><p>− 를 눌러 지울 장소를 고르고 <b>저장</b>을 누르세요. 취소하면 아무것도 바뀌지 않아요.</p>
        <div class="seg">${['food','hotel','spot'].map(t=>`<button data-tab="${t}" aria-pressed="${t===tab}">${TYPE_LABEL[t]} ${all().filter(p=>p.type===t&&!removed0.has(p.id)).length}</button>`).join('')}</div></div>
      <div class="modal-b">${body}${goneHTML}</div>
      <div class="modal-f"><span class="meta">${cnt?`변경 ${cnt}건`:'변경 없음'}</span><button class="btn" data-cancel>취소</button><button class="btn primary" data-save ${cnt?'':'disabled'}>저장</button></div>`;
  };
  openModal(''); document.addEventListener('keydown', escClose);
  modalEl.addEventListener('click',e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.tab){ tab=t.dataset.tab; draw(); return; }
    if(t.dataset.del){ staged.add(t.dataset.del); draw(); return; }
    if(t.dataset.undo){ staged.delete(t.dataset.undo); draw(); return; }
    if(t.dataset.restore){ restore.add(t.dataset.restore); draw(); return; }
    if(t.dataset.unrestore){ restore.delete(t.dataset.unrestore); draw(); return; }
    if('cancel' in t.dataset){ closeModal(); return; }
    if('save' in t.dataset){
      const rm=new Set(lsGet('removed',[])); staged.forEach(id=>rm.add(id)); restore.forEach(id=>rm.delete(id));
      // 직접 추가했던 장소는 목록에서 완전히 지움
      const addedIds=new Set(lsGet('added',[]).map(x=>x.id)); const dropAdded=[...staged].filter(id=>addedIds.has(id));
      if(dropAdded.length){ lsSet('added', lsGet('added',[]).filter(x=>!dropAdded.includes(x.id))); dropAdded.forEach(id=>rm.delete(id)); }
      lsSet('removed',[...rm]);
      const nm=id=>{ const p=all().find(x=>x.id===id); return p?p.name:id; };
      if(staged.size) pushLocalEvent({type:'deleted', names:[...staged].map(nm)});
      if(restore.size) pushLocalEvent({type:'restored', names:[...restore].map(nm)});
      closeModal(); afterPlacesChanged(); return;
    }
  });
  draw();
}

function parseInput(text){
  let q=text.trim(), coord=null; const urls=q.match(/https?:\/\/\S+/g)||[];
  for(const u of urls){
    let d=u; try{ d=decodeURIComponent(u); }catch(e){}
    const m3=d.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || d.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || d.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
    if(m3) coord={lat:+m3[1],lng:+m3[2]};
    const mp=d.match(/\/maps\/place\/([^/@?]+)/); if(mp) q=q.replace(u, ' '+mp[1].replace(/\+/g,' ')+' ');
    else { const mq=d.match(/[?&](?:q|query)=([^&]+)/); if(mq && !/^-?\d+\.\d+,/.test(mq[1])) q=q.replace(u,' '+mq[1].replace(/\+/g,' ')+' '); else q=q.replace(u,' '); }
  }
  return {q:q.replace(/\s+/g,' ').trim(), coord, hadUrl:urls.length>0, onlyShortUrl: urls.length>0 && !coord && !q.replace(/\s+/g,'').length};
}

    <div class="modal-f"><span class="meta"></span><button class="btn" data-cancel>닫기</button></div>`;
}

      status='Google 지도에서 찾는 중…'; draw();

        status=cands.length?'AI 없이 Google 검색 결과예요. 맞는 곳의 + 를 누르면 추가돼요 (모든 기기에 공유).':'Google 지도에서 찾지 못했어요.'; }catch(err){ status='검색 실패: '+esc(err.message||err); }

      const p={id:'u-'+c.pid.slice(-12)+'-'+Date.now().toString(36), gpid:c.pid, type:cat, city:cityOf(c.lat,c.lng), lat:c.lat, lng:c.lng, name:c.name||'이름 없음', nameJa:(ja&&ja.displayName&&ja.displayName.text)||'', address:(ja&&ja.formattedAddress)||c.address||'', area:c.typeKo||'', gtypes:c.types||[], group:cat==='food'?(grp.trim()||autoGroup(c.types,c.typeKo,emojiOf(c.types))):(cat==='spot'?'관광지':''), emoji:'', origin:'added', typed:input.slice(0,300), notes:[]};
      p.emoji = cat==='hotel' ? '' : ((cat==='food'&&GROUP_EMOJI[p.group])||emojiOf(c.types)||(cat==='spot'?'📍':'🍴'));
      const added=lsGet('added',[]); added.push(p); lsSet('added',added);
      pushLocalEvent({type:'added', cat, text:input.slice(0,300), places:[{id:p.id,name:p.name,nameJa:p.nameJa,city:p.city}], note:'AI 없이 구글 검색으로 추가'});
      closeModal(); afterPlacesChanged(); setCity(p.city,true); select(p.id,false); return;

/* 변경 모달 — 카테고리(맛집·숙소·관광지)와 맛집 필터(라멘·스시…)를 하나씩 또는 여러 개 한꺼번에. 저장 전까지는 표시만 */
function openChangeModal(){
  const E0=lsGet('edits',{});
  const draft={};            // id -> {type, group}  (이번에 바꾼 값)
  const picked=new Set();
  let tab='food', q='';
  const removed=new Set(lsGet('removed',[]));
  const orig=id=>[...BASE,...lsGet('added',[])].find(x=>x.id===id);
  const cur=id=>byId[id]||orig(id);
  const val=p=>{ const d=draft[p.id]||{}; const type=d.type||p.type; const g=d.group!==undefined?d.group:(type==='food'&&p.type==='food'?catOf(p):''); return {type,group:g}; };
  const list=()=>P.filter(p=>p.type===tab && (!q || (p.name+' '+(p.nameJa||'')+' '+(p.area||'')+' '+catOf(p)).toLowerCase().includes(q.toLowerCase())));
  const ctl=(p,v)=>`<div class="ctl chg"><select data-type="${esc(p.id)}" aria-label="카테고리">${['food','hotel','spot'].map(t=>`<option value="${t}"${t===v.type?' selected':''}>${TYPE_LABEL[t]}</option>`).join('')}</select>${v.type==='food' ? grpSelect(`data-group="${esc(p.id)}"`, v.group, null, newGroups()) : '<select disabled aria-label="필터"><option>필터 없음</option></select>'}</div>`;
  const nDirty=()=>Object.keys(draft).length;
  const newGroups=()=>Object.values(draft).map(d=>d.group).filter(Boolean);
  const rowsHTML=()=>{ const L=list(); return L.length ? L.map(p=>{ const v=val(p); return `<div class="mrow chg-row${picked.has(p.id)?' on':''}${draft[p.id]?' dirty':''}" data-row="${esc(p.id)}"><input type="checkbox" class="cb" data-pick="${esc(p.id)}" ${picked.has(p.id)?'checked':''} aria-label="${esc(p.name)} 선택">${thumbOrIco(p)}<div class="mi"><div class="mn">${esc(p.name)}</div><div class="meta">${esc(CITY[p.city]?CITY[p.city].name:'')} · ${esc(p.area||'')}</div></div>${ctl(p,v)}</div>`; }).join('') : '<div class="empty">해당하는 장소가 없어요.</div>'; };
  const foot=()=>`<span class="meta">${nDirty()?`변경 ${nDirty()}건`:'변경 없음'}</span><button class="btn" data-cancel>취소</button><button class="btn primary" data-save ${nDirty()?'':'disabled'}>저장</button>`;
  const bulk=()=>`<div class="chg-bulk chg"><b>${picked.size?`선택 ${picked.size}개`:'여러 개 한꺼번에:'}</b>${picked.size?`<select id="bType" aria-label="카테고리"><option value="">카테고리 그대로</option>${['food','hotel','spot'].map(t=>`<option value="${t}">${TYPE_LABEL[t]}</option>`).join('')}</select>${grpSelect('id="bGroup"', '', ['', '필터 그대로'], newGroups())}<button class="btn" data-bulk>적용</button><button class="btn" data-unpick>선택 해제</button>`:'<span class="meta">체크박스로 여러 곳을 고르면 한 번에 바꿀 수 있어요.</span>'}<button class="btn" data-all style="margin-left:auto">${list().length&&list().every(p=>picked.has(p.id))?'전체 해제':'보이는 것 전체 선택'}</button></div>`;
  const draw=(keepFocus)=>{
    const m=modalEl.querySelector('.modal');
    if(keepFocus){ m.querySelector('.modal-b').innerHTML=rowsHTML(); m.querySelector('.chg-bulk').outerHTML=bulk(); m.querySelector('.modal-f').innerHTML=foot(); return; }
    m.innerHTML=`<div class="modal-h">${modeTabs('chg')}<h2>장소 변경</h2><p>카테고리(맛집·숙소·관광지)와 맛집 <b>필터</b>(라멘·스시·오코노미야키…)를 바꿀 수 있어요. 필터는 목록에서 고르거나 새 이름을 적으면 돼요. <b>저장</b>을 눌러야 반영돼요.</p>
      <div class="seg">${['food','hotel','spot'].map(t=>`<button data-tab="${t}" aria-pressed="${t===tab}">${TYPE_LABEL[t]} ${P.filter(p=>p.type===t).length}</button>`).join('')}</div>
      <input class="chg-search" id="chgQ" type="search" placeholder="이름·지역·필터로 찾기" value="${esc(q)}">${bulk()}</div>
      <div class="modal-b">${rowsHTML()}</div><div class="modal-f">${foot()}</div>`;
  };
  // 원래 값과 같아지면 draft에서 뺌
  const setDraft=(id,patch)=>{ const p=cur(id); if(!p) return; const d=Object.assign({}, draft[id]||{}, patch);
    const type=d.type||p.type; if(type!=='food') delete d.group;
    if(d.type===p.type) delete d.type; if(d.group!==undefined && type==='food' && p.type==='food' && d.group===catOf(p)) delete d.group;
    if(Object.keys(d).length) draft[id]=d; else delete draft[id]; };
  openModal(''); modalEl.dataset.kind='chg'; document.addEventListener('keydown', escClose);
  modalEl.addEventListener('input',e=>{ if(e.target.id==='chgQ'){ q=e.target.value; draw(true); } });
  modalEl.addEventListener('change',e=>{ const t=e.target;
    if(t.dataset.type){ setDraft(t.dataset.type,{type:t.value}); draw(true); return; }
    if(t.dataset.group){ if(t.value==='__new'){ grpNewInput(t); return; } if(!t.value.trim()) return; setDraft(t.dataset.group,{group:t.value.trim()}); draw(true); return; }
    if(t.id==='bGroup' && t.value==='__new'){ grpNewInput(t); return; }
    if(t.dataset.pick){ t.checked?picked.add(t.dataset.pick):picked.delete(t.dataset.pick); draw(true); return; } });
  modalEl.addEventListener('click',e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.tab){ tab=t.dataset.tab; picked.clear(); draw(); return; }
    if('all' in t.dataset){ const L=list(); const all=L.length&&L.every(p=>picked.has(p.id)); L.forEach(p=>all?picked.delete(p.id):picked.add(p.id)); draw(true); return; }
    if('unpick' in t.dataset){ picked.clear(); draw(true); return; }
    if('bulk' in t.dataset){ const ty=modalEl.querySelector('#bType').value, g=modalEl.querySelector('#bGroup').value.trim();
      if(!ty && !g) return;
      picked.forEach(id=>{ const patch={}; if(ty) patch.type=ty; if(g && (ty||val(cur(id)).type)==='food') patch.group=g; setDraft(id,patch); });
      picked.clear(); draw(true); return; }
    if('cancel' in t.dataset){ closeModal(); return; }
    if('save' in t.dataset){
      const E=Object.assign({}, lsGet('edits',{}));
      for(const id in draft){ const p=orig(id); if(!p) continue; const d=draft[id], prev=E[id]||{};
        const type=d.type||cur(id).type, n={};
        if(type!==p.type) n.type=type;
        const g = d.group!==undefined ? d.group : (type==='food' ? prev.group : undefined);
        if(type==='food' && g){ n.group=g; if(GROUP_EMOJI[g]) n.emoji=GROUP_EMOJI[g]; }
        else if(type==='food' && p.type!=='food'){ n.group='기타'; n.emoji='🍴'; }
        E[id]=n; }
      lsSet('edits',E); closeModal(); afterPlacesChanged(); return; }
  });
  draw();
}

function modeTabs(cur){ const T=[['add','추가','+','var(--walk)'],['chg','변경','✎','var(--brand)'],['del','삭제','−','var(--food)']];

document.addEventListener('click',e=>{ const b=e.target.closest('.mtabs [data-mode]'); if(!b||b.getAttribute('aria-selected')==='true') return; e.stopPropagation();

/* ---------- PC: 목록·상세 가로폭 조절 (이 기기에만 기억) ---------- */
(function(){ const app=document.querySelector('.app'), DEF={w1:420,w2:400}, MIN=300;
  const W=lsGet('paneW',{});
  const maxOf=k=>{ const other=k==='w1' ? (app.classList.contains('has-detail')?(W.w2||DEF.w2):0) : (W.w1||DEF.w1); return Math.max(MIN, Math.min(900, innerWidth-other-360)); };   // 지도는 최소 360px 남김
  const apply=()=>{ ['w1','w2'].forEach(k=>{ if(W[k]) app.style.setProperty('--'+k, Math.min(W[k],maxOf(k))+'px'); else app.style.removeProperty('--'+k); }); };
  apply(); addEventListener('resize',apply);
  document.querySelectorAll('.pane-rs').forEach(h=>{ const k=h.dataset.rs;
    h.addEventListener('pointerdown',e=>{ if(e.button!==0) return; e.preventDefault(); h.setPointerCapture(e.pointerId);
      const x0=e.clientX, w0=h.parentElement.getBoundingClientRect().width; h.classList.add('on'); document.body.classList.add('rs-drag');
      const mv=ev=>{ W[k]=Math.round(Math.max(MIN, Math.min(maxOf(k), w0+ev.clientX-x0))); app.style.setProperty('--'+k, W[k]+'px'); };
      const up=()=>{ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); h.removeEventListener('pointercancel',up);
        h.classList.remove('on'); document.body.classList.remove('rs-drag'); try{ localStorage.setItem('paneW', JSON.stringify(W)); }catch(e){} };
      h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up); });
    h.addEventListener('dblclick',()=>{ delete W[k]; try{ localStorage.setItem('paneW', JSON.stringify(W)); }catch(e){} apply(); }); });
})();

/* ---------- 리스트 썸네일 (Google 지도 사진) ---------- */
const THUMB = lsGet('thumbs',{});   // id -> {pid, photo, at}  (Place ID는 장기 보관 가능, 사진 이름은 3일만)
const PHOTO_TTL = 3*24*3600e3;
for(const k in THUMB){ if(!THUMB[k].at || Date.now()-Date.parse(THUMB[k].at)>PHOTO_TTL) THUMB[k]={pid:THUMB[k].pid, at:null}; }
const photoURL = (name,w) => `https://places.googleapis.com/v1/${name}/media?maxWidthPx=${w}&maxHeightPx=${w}&key=${GKEY}`;
const thumbQ=[]; let thumbActive=0; const thumbBusy=new Set();
function pumpThumb(){ while(thumbActive<3 && thumbQ.length){ const p=thumbQ.shift(); thumbActive++; fetchThumb(p).finally(()=>{ thumbActive--; pumpThumb(); }); } }
async function fetchThumb(p){
  try{
    const t=THUMB[p.id]||{};
    let photo=null, pid=t.pid||p.gpid||null;
    if(pid){ const r=await gpost(`https://places.googleapis.com/v1/places/${encodeURIComponent(pid)}`,'photos.name',undefined,'GET'); photo=r.photos&&r.photos[0]&&r.photos[0].name; }
    else {
      const j=await gpost('https://places.googleapis.com/v1/places:searchText','places.id,places.location,places.photos.name',
        {textQuery:`${p.nameJa||p.name} ${p.address||''}`, regionCode:'JP', pageSize:3, locationBias:{circle:{center:{latitude:p.lat,longitude:p.lng},radius:300}}});
      const best=(j.places||[]).filter(x=>x.location).map(x=>({x,d:haversine(p,{lat:x.location.latitude,lng:x.location.longitude})})).sort((a,b)=>a.d-b.d).find(c=>c.d<=250);
      if(best){ pid=best.x.id; photo=best.x.photos&&best.x.photos[0]&&best.x.photos[0].name; }
    }
    THUMB[p.id]={pid:pid||'', photo:photo||'', at:new Date().toISOString()}; lsSet('thumbs',THUMB);
    paintThumb(p.id);
  }catch(err){ console.warn('thumb', err); }
}
function paintThumb(id){
  const t=THUMB[id]; if(!t||!t.photo) return;
  document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"] .ico`).forEach(ico=>{ ico.classList.add('has-thumb'); ico.innerHTML=`<img class="thumb" alt="" loading="lazy" src="${photoURL(t.photo,160)}">`; });
}
const thumbIO = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; thumbIO.unobserve(e.target);
  const id=e.target.closest('.card').dataset.id, p=byId[id]; if(!p) return; const t=THUMB[id];
  if(t && t.at && Date.now()-Date.parse(t.at)<PHOTO_TTL){ paintThumb(id); return; }
  if(!thumbBusy.has(id)){ thumbBusy.add(id); thumbQ.push(p); pumpThumb(); } }), {root:document.getElementById('scroll'), rootMargin:'200px'}) : null;
function observeThumbs(){ if(!thumbIO) return; sheetEl.querySelectorAll('.card .ico').forEach(el=>{ const id=el.closest('.card').dataset.id; const t=THUMB[id];
  if(t&&t.photo&&t.at&&Date.now()-Date.parse(t.at)<PHOTO_TTL){ paintThumb(id); } else thumbIO.observe(el); }); }

/* ---------- 공용 저장소 (Cloudflare Worker + D1) ----------
   순위·삭제·추가·알림·지하철 조회 결과를 서버에 저장 → 어느 기기·브라우저에서 열어도 같게 보임.
   기기 저장(localStorage)은 서버 값의 사본 + 오프라인 대비. */
const SYNC_URL = 'https://osaka-map-sync.osaka-kyoto-map.workers.dev';
var SYNC_KEYS = ['ranks','edits','removed','added','localEvents'];
var syncPending = {}, syncTimer=0, syncReady=false, SRV_NV={}, nvTimer=0, nvPushing=false;
function syncMark(k){ if(!SYNC_KEYS || !SYNC_KEYS.includes(k)) return; syncPending[k]=true; clearTimeout(syncTimer); syncTimer=setTimeout(syncPush,300); }
async function syncPush(){
  for(const k of Object.keys(syncPending)){
    try{ const r=await fetch(`${SYNC_URL}/kv/${k}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:localStorage.getItem(k)||(k==='ranks'||k==='edits'?'{}':'[]')});
      if(r.ok){ delete syncPending[k]; const j=await r.json().catch(()=>null); if(j&&j.value!==undefined&&!syncPending[k]) applySynced(k,j.value); } }catch(e){}
  }
  if(Object.keys(syncPending).length){ clearTimeout(syncTimer); syncTimer=setTimeout(syncPush,5000); }   // 오프라인이면 잠시 뒤 재시도
}
function applySynced(k,v){   // 서버 값 → 이 기기 사본. 바뀐 게 있으면 true
  const nv=JSON.stringify(v); if(localStorage.getItem(k)===nv) return false;
  try{ localStorage.setItem(k,nv); }catch(e){}
  if(k==='ranks') RANKS=Object.assign({}, v);
  return true;
}
function syncTransitSoon(){ if(!syncReady) return; clearTimeout(nvTimer); nvTimer=setTimeout(syncTransit,1500); }
async function syncTransit(){
  if(nvPushing||!syncReady) return; const out={};
  for(const k in TR){ const t=TR[k]; if(!t||t.status!=='ok') continue; const s=SRV_NV[k]; if(!s||Date.parse(t.at)>Date.parse(s.at)) out[k]={routes:t.routes, at:t.at, basis:t.basis, c:t.c, src:t.src}; }
  if(!Object.keys(out).length) return;
  nvPushing=true;
  try{ const r=await fetch(`${SYNC_URL}/kv/nvcache`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)}); if(r.ok) Object.assign(SRV_NV,out); }catch(e){}
  nvPushing=false;
}
async function syncPull(){
  let s; try{ const r=await fetch(`${SYNC_URL}/state`,{cache:'no-store'}); if(!r.ok) return; s=await r.json(); }catch(e){ return; }
  let places=false, ranks=false, bell=false, tr=false;
  for(const k of SYNC_KEYS){ if(syncPending[k] || !(k in s)) continue;
    if(applySynced(k,s[k])){ if(k==='ranks') ranks=true; else if(k==='localEvents') bell=true; else places=true; } }
  SRV_NV = s.nvcache||{};
  for(const k in SRV_NV){ const e=SRV_NV[k], cur=TR[k]; if(!e||!Array.isArray(e.routes)||(cur&&cur.status==='loading')) continue;
    if(!cur || cur.status!=='ok' || Date.parse(e.at)>Date.parse(cur.at) || (e.at===cur.at && e.src!==cur.src)){ TR[k]={status:'ok', routes:e.routes.map(cleanRoute), at:e.at, basis:e.basis, c:e.c, src:e.src, shared:true}; tr=true; } }
  const first=!syncReady; syncReady=true;
  if(tr){ const o={}; for(const k in TR) if(TR[k].status==='ok') o[k]={routes:TR[k].routes, at:TR[k].at, basis:TR[k].basis, c:TR[k].c, src:TR[k].src}; try{ localStorage.setItem('nvcache', JSON.stringify(o)); }catch(e){} }
  if(bell) renderBell();
  if(places) afterPlacesChanged(); else if(ranks||tr){ renderList(); refreshMarkers(); }
  const h = state.sel&&byId[state.sel]&&byId[state.sel].type==='hotel' ? byId[state.sel] : null;
  if(h && (ranks||places)) showHotelRanks(h);
  else if(state.sel && tr) document.querySelectorAll(`[data-near="${state.sel}"]`).forEach(tb=>tb.innerHTML=nearTable(byId[state.sel]));
  if(first) syncTransit();   // 이 기기에만 있던 조회 결과 올리기
}
setInterval(()=>{ if(document.visibilityState==='visible') syncPull(); }, 20000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncPull(); });

/* ---------- init ---------- */
rebuildPlaces(); renderBell(); if(lsGet('bridgeUsed',false)) pollBridge();   // AI 브리지를 쓴 적 있는 기기(PC)만 연결 시도
fillSelects(); setCity('osaka');
const hp=new URLSearchParams(location.hash.slice(1));
// #export: 이 브라우저에 저장된 지하철 조회 기록을 파일로 내려받기 → 공유 파일(data/transit.js)에 합치는 용도
if(location.hash==='#export'){ try{ const raw=localStorage.getItem('nvcache')||'{}', n=Object.keys(JSON.parse(raw)).length;
  const u=URL.createObjectURL(new Blob([raw],{type:'application/json'})), el=document.createElement('a'); el.href=u; el.download='transit-export.json'; document.body.append(el); el.click(); el.remove();
  setTimeout(()=>{ const m=document.createElement('div'); m.className='mapmsg'; m.style.cssText='position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:9999;background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);font-weight:700'; m.textContent=`지하철 조회 기록 ${n}건을 transit-export.json 으로 저장했어요`; document.body.append(m); setTimeout(()=>m.remove(),6000); },300);
}catch(e){ console.warn('export',e); } }
if(hp.get('from')||hp.get('to')) setRoute(byId[hp.get('from')]?hp.get('from'):'', byId[hp.get('to')]?hp.get('to'):'');
const s=document.createElement('script');
s.src=`https://maps.googleapis.com/maps/api/js?key=${GKEY}&v=weekly&language=ko&region=JP&loading=async&callback=__initMap`;
s.async=true; s.onerror=()=>{ document.getElementById('gmap').innerHTML='<div class="mapmsg">Google 지도 스크립트를 불러오지 못했어요.</div>'; };
document.head.appendChild(s);
syncPull();
})();
</script>
