<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오사카·교토 맛집 지도</title>
<meta name="description" content="유튜브 댓글 추천 맛집과 우리가 고른 가게, 숙소, 관광지를 한 지도에서 보고 숙소별 순위 맛집까지의 거리·시간을 확인하는 여행 지도">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --ink:#1d1b18; --ink2:#5d5850; --ink3:#8f887d; --line:#e7e2d9;
  --food:#e0452b; --food-soft:#fdece8; --hotel:#2456d6; --hotel-soft:#e8eefc; --walk:#11875d; --walk-soft:#e3f4ec; --spot:#0b8043; --spot-soft:#e2f3e8;
  --r1:#e0452b; --r2:#f08c00; --r3:#e2b100;
  --pin-food:#e5251e; --pin-food-d:#9e1410; --pin-hotel:#ffc400; --pin-hotel-d:#a87b00; --pin-spot:#9dff00; --pin-spot-d:#4f8a00;
  --accent:#1d1b18; --warn:#9a5b00; --warn-soft:#fff4dc; --radius:14px; --shadow:0 6px 24px rgba(29,27,24,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:420px minmax(0,1fr);height:100dvh}
.side,.mapwrap{min-width:0}
.side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0;z-index:2}
.side-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.title{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{font-size:12.5px;color:var(--ink3);margin:4px 0 0}
.legend{display:flex;gap:10px;margin-top:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.food{background:#fff;border:2px solid var(--food)} .dot.hotel{background:var(--hotel);border-radius:3px}
.dot.r1{background:var(--r1)} .dot.r2{background:var(--r2)} .dot.r3{background:var(--r3)}
.dot.spot{background:var(--spot)} .dot.zone{background:rgba(124,77,255,.22);border:1px solid #7c4dff;border-radius:3px}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:12px 14px 40px}

/* route box */
.routebox{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0 16px;margin-bottom:14px}
.rb-title{font-size:14px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.rb-row{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px;margin-bottom:6px}
.rb-row label{font-size:12px;font-weight:700;color:var(--ink2)}
.rb-row select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.rb-actions{display:flex;gap:6px}
.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.book{background:#1a73e8;color:#fff;border-color:#1a73e8}
.result{margin-top:10px}
.modes{display:flex;gap:6px;margin-bottom:8px}
.mode{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left}
.mode[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode b{display:block;font-size:17px}
.mode small{font-size:11.5px;color:var(--ink3)}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.step:last-child{border-bottom:0}
.step .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--walk-soft)}
.meta{font-size:12px;color:var(--ink3)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.alts{margin-top:8px;font-size:12.5px;color:var(--ink2)}
.alts li{margin:3px 0}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* list */
.sec{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:16px 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow)}
.card.sel{border-color:var(--ink);box-shadow:var(--shadow)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-main{flex:1;min-width:0}
.ico{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--pin-food);box-shadow:inset 0 0 0 7px var(--pin-food),inset 0 0 0 40px #fff}
.card.hotel .ico{background:var(--pin-hotel);box-shadow:inset 0 0 0 7px var(--pin-hotel),inset 0 0 0 40px #fff}
.card.hotel .ico span{color:#5a4300!important}
.card.cand .ico{background:#fff;border:2px dashed var(--food)}
.card.spot .ico{background:var(--pin-spot);box-shadow:inset 0 0 0 7px var(--pin-spot),inset 0 0 0 40px #fff}
.nm{font-weight:800;font-size:15px;line-height:1.3}
.ja{font-size:12px;color:var(--ink3);margin-top:2px}
.area{font-size:12px;color:var(--ink2);margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--food-soft);color:var(--food);margin-right:4px}
.tag.cand{background:#fff;border:1px dashed var(--food)}
.tag.hotel{background:var(--hotel-soft);color:var(--hotel)}
.tag.spot{background:var(--spot-soft);color:var(--spot)}
.rk{position:relative;display:inline-block!important;width:22px;height:22px;flex:none;border-radius:50%;font-size:0!important;color:transparent;padding:0;vertical-align:-6px;border:1.5px solid transparent;box-sizing:border-box;overflow:hidden}
.rk::after{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;line-height:1;color:initial}
.rk.r1::after{content:'👑'} .rk.r2::after{content:'🥈'} .rk.r3::after{content:'🥉'}
.rk.r1{background:#f2c200;border-color:#f2c200} .rk.r2{background:#a9b4bf;border-color:#a9b4bf} .rk.r3{background:#c47f45;border-color:#c47f45}
.rankset{flex:none;display:flex;gap:3px}
.rankset button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0;filter:grayscale(1);opacity:.45}
.rankset button[aria-pressed=true]{filter:none;opacity:1}
.rankset button[aria-pressed=true].r1{background:#f2c200;border-color:#f2c200}
.rankset button[aria-pressed=true].r2{background:#a9b4bf;border-color:#a9b4bf}
.rankset button[aria-pressed=true].r3{background:#c47f45;border-color:#c47f45}
.credit{font-size:11px;color:var(--ink3);margin:18px 2px 0;line-height:1.5}
.detail{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.card.sel .detail{display:block}
.tip{background:#fff6dc;border:1px solid #f1d27a;border-radius:10px;padding:9px 11px;line-height:1.55;font-size:13.5px;margin:8px 0}
.quote{background:var(--bg);border-radius:10px;padding:9px 11px;white-space:pre-line;line-height:1.55;font-size:13.5px}
.quote-h{font-size:11.5px;font-weight:700;color:var(--ink3);margin:0 0 4px}
.facts{margin:8px 0 0;padding-left:16px;color:var(--ink2);font-size:12.5px;line-height:1.55}
.addr{font-size:12px;color:var(--ink3);margin-top:8px}
table.near{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.near th{font-size:11px;color:var(--ink3);text-align:left;font-weight:700;padding:4px}
table.near td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
table.near td.n{font-weight:700}
table.near tr[data-route]{cursor:pointer}
table.near tr[data-route]:hover td{background:var(--bg)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink2);font-size:13.5px;line-height:1.6;background:#fff}

/* google place info */
.gp{margin:10px 0 2px}
.gp-photos{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gp-photos figure{margin:0;flex:none;width:220px;scroll-snap-align:start}
.gp-photos img{width:220px;height:150px;object-fit:cover;border-radius:10px;background:var(--bg);display:block}
.gp-photos figcaption{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-photos figcaption a{color:inherit}
.gp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:6px}
.gp-open{font-weight:700} .gp-open.on{color:var(--walk)} .gp-open.off{color:var(--food)}
.gp details{font-size:12.5px;color:var(--ink2);margin-top:4px}
.gp details ul{margin:4px 0 0;padding-left:16px;line-height:1.6}
.gp-src{font-size:10.5px;color:var(--ink3);margin-top:4px}

/* hotel rank summary */
.ranksum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.ranksum div{background:var(--bg);border-radius:10px;padding:8px;font-size:12px;line-height:1.45}
.ranksum b{font-size:15px;display:block}

/* map */
.mapwrap{position:relative;min-height:0;overflow:hidden}
#gmap{position:absolute;inset:0;background:#e9e5dd}
#embed{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#e9e5dd;z-index:3}
.mapwrap.embed #embed{display:block}
.mapbar{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:5;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;white-space:nowrap}
.pill{background:rgba(255,255,255,.96);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);border:0;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit}
.pill.on{background:var(--ink);color:#fff}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.6}
/* markers */
.pin{position:relative;width:30px;height:40px;cursor:pointer;transform-origin:50% 100%;transition:transform .12s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin svg.pbg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pin .pico{position:absolute;left:50%;top:37.5%;transform:translate(-50%,-50%);width:66%;height:50%;display:grid;place-items:center;font-size:14px;line-height:1;color:#5a4300}
.pin .pico svg{width:16px;height:16px}
.pin.big{width:38px;height:50px} .pin.big .pico{font-size:18px} .pin.big .pico svg{width:19px;height:19px}
.pin.sel{transform:scale(1.25);z-index:9}
.pin.dim{opacity:.4}
.tlabel{transform:translateY(50%);background:#fff;border-radius:999px;padding:2px 7px;font-size:11.5px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap;border:2px solid currentColor}
.zlabel{transform:translateY(50%);font-size:11px;font-weight:800;color:#5a2fd6;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;pointer-events:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:46dvh minmax(0,1fr)}
  .mapwrap{order:1}
  .side{order:2;border-right:0;border-top:1px solid var(--line)}
  .side-head{padding:12px 16px 10px}
  .scroll{padding:10px 16px 40px}
  .mapbar{bottom:14px}
}
@media (max-width:860px) and (max-height:520px){
  .app{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
  .mapwrap{order:2} .side{order:1;border-top:0;border-right:1px solid var(--line)}
}
/* head actions */
.title-row{display:flex;align-items:center;gap:8px}
.title-row .title{flex:1;min-width:0}
.hbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.hbtn .circ{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;color:#fff;font-weight:800}
.hbtn.add .circ{background:var(--walk)} .hbtn.del .circ{background:var(--food)}
/* thumbnails */
.thumb{flex:none;width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--bg);display:block}
.ico.has-thumb{width:56px;height:56px;border-radius:12px;background:var(--bg)!important;border:0!important;overflow:hidden;padding:0}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:1000;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:min(86dvh,760px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-h{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:17px;font-weight:800}
.modal-h p{margin:4px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.5}
.modal-b{padding:12px 18px;overflow-y:auto;flex:1;min-height:0}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.modal-f .meta{flex:1}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mi{flex:1;min-width:0}
.mrow .mn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.gone .mn{text-decoration:line-through;color:var(--ink3)}
.mrow.gone .thumb,.mrow.gone .mico{opacity:.35}
.mico{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--bg);font-size:18px}
.minus{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--food);color:#fff;font-size:20px;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.minus.undo{background:#fff;color:var(--ink2);border:1.5px solid var(--line);font-size:12px;width:auto;padding:0 10px;border-radius:999px;height:28px}
.plus{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--walk);color:#fff;font-size:20px;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff}
.field textarea{min-height:90px;resize:vertical}
.cand{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.cand .mi{flex:1;min-width:0}
.cand .mn{font-weight:800;font-size:14px}
.cand .meta{line-height:1.45}
.sub-h{font-size:12px;font-weight:800;color:var(--ink3);margin:14px 0 4px}
.bell{position:relative;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.bell .badge{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#e5484d;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;border:2px solid #fff;box-sizing:content-box}
.bell.running .badge{background:#1a5fb4;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.nrow{padding:11px 2px;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.newdot{font-size:10.5px;font-weight:800;color:#fff;background:#e5484d;border-radius:999px;padding:1px 6px}
.nlink{display:block;border:0;background:none;padding:3px 0;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.lpin{flex:none;width:12px;height:16px;display:inline-block;vertical-align:-3px;overflow:visible}
.ico.has-thumb{box-shadow:none}
.ctlgrp{display:flex;gap:8px;margin-top:12px}
.ctl{position:relative;flex:1 1 0;min-width:0}
.ctlbtn{display:flex;align-items:center;gap:9px;width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.ctlbtn .ctlk{flex:none;font-size:11.5px;font-weight:700;color:var(--ink3)}
.ctlbtn .ctlv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctlbtn>svg{flex:none;opacity:.55;transition:transform .16s}
.ctl.open .ctlbtn{border-color:var(--ink)}
.ctl.open .ctlbtn>svg{transform:rotate(180deg)}
.ctlpanel{position:absolute;left:0;top:calc(100% + 7px);width:max-content;min-width:100%;max-width:min(360px,calc(100vw - 32px));z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.10);padding:4px 16px;opacity:0;visibility:hidden;transform:translateY(-5px);transition:opacity .14s,transform .14s,visibility .14s}
.ctl.open .ctlpanel{opacity:1;visibility:visible;transform:none}
.ctlpanel .frow{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.ctlpanel .frow+.frow{border-top:1px solid var(--line)}
.ctlpanel .fkey{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.02em}
.ctlpanel .fval{display:flex;flex-wrap:wrap;gap:8px}
.ctlpanel .tab,.ctlpanel .chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid #e9e9e9;background:#fff;color:var(--ink3);font-size:13px;font-weight:500;cursor:pointer}
.ctlpanel .tab:hover,.ctlpanel .chip:hover{border-color:#c8c8c8}
.ctlpanel .tab[aria-selected=true],.ctlpanel .chip[aria-pressed=true]{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.bell .badge[hidden]{display:none}
.osm-attr{position:absolute;left:6px;bottom:26px;z-index:5;font-size:10px;color:#555;background:rgba(255,255,255,.75);padding:1px 5px;border-radius:4px;pointer-events:none}
.ctlpanel.right{left:auto;right:0}
.rankset button{display:grid;place-items:center;line-height:0}
.rb-grid{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.rbox{position:relative;display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;min-width:0}
.rbox:focus-within{border-color:var(--ink)}
.rbox .ctlk{flex:none;font-size:11.5px;font-weight:700;color:var(--ink3)}

const koLine = n => { if(!n) return ''; for(const [ja,ko] of KO_LINE) if(n.includes(ja)) return ko; return ''; };

function jstNow(){ const j=new Date(Date.now()+9*3600e3); const h=j.getUTCHours(); const d=j.toISOString().slice(0,10); return (h<6||h>=22) ? `${d}T12:00:00` : j.toISOString().slice(0,19); }
function parseItem(it){
  const m=it.summary.move, secs=it.sections||[];

  for(let i=0;i<secs.length;i++){ const s=secs[i]; if(s.type!=='move') continue;

async function loadPlace(p){

      'places.id,places.displayName,places.location,places.rating,places.userRatingCount,places.websiteUri,places.nationalPhoneNumber,places.internationalPhoneNumber,places.regularOpeningHours.weekdayDescriptions,places.currentOpeningHours.openNow,places.photos.name,places.photos.authorAttributions,places.reservable,places.googleMapsUri,places.businessStatus',
      {textQuery:`${p.nameJa} ${p.address}`, languageCode:'ko', regionCode:'JP', pageSize:3, locationBias:{circle:{center:{latitude:p.lat,longitude:p.lng}, radius:300}}});
    // 우리 좌표에서 250m 안에 있는 결과만 같은 가게로 인정 (엉뚱한 가게 정보가 붙는 것을 막음)
    const cands = (j.places||[]).map(x=>({x, d: x.location ? haversine(p,{lat:x.location.latitude,lng:x.location.longitude}) : 1e9})).sort((a,b)=>a.d-b.d);

    `<button class="btn small" data-setfrom="${p.id}">여기서 출발</button><button class="btn small" data-setto="${p.id}">여기로 도착</button></div>`;
  body += `<div data-near="${p.id}">${nearTable(p)}</div>`;
  return `<article class="${cls}" data-id="${p.id}"><div class="card-top"><div class="ico">${ico}</div><div class="card-main"><div class="nm">${esc(p.name)}</div><div class="ja">${esc(p.nameJa)}</div><div class="area">${tags}${esc(p.area)}</div></div>${rankset}</div><div class="detail">${body}</div></article>`;
}
function renderList(){
  const items = P.filter(p=>p.city===state.city);

  const f = state.filter; let h='';
  if(f==='all'||f==='hotel'||f==='ranked'){
    h += `<div class="sec">숙소 ${hotels.length}</div>`;
    h += hotels.length ? hotels.map(cardHTML).join('') : `<div class="empty">아직 등록된 ${CITY[state.city].name} 숙소가 없어요.</div>`;
  }
  if(f==='all'||f==='food'||f==='ranked'){
    const ranked = foods.filter(q=>rankOf(q)>0).sort((a,b)=>rankOf(a)-rankOf(b));
    if(ranked.length) h += `<div class="sec">순위 맛집 ${ranked.length}</div>` + ranked.map(cardHTML).join('');

      if(!foods.length) h += `<div class="sec">맛집 0</div><div class="empty">${CITY[state.city].name}에는 아직 등록된 맛집이 없어요.</div>`;
      groups.forEach(g=>{ const fs=rest.filter(x=>x.group===g); h += `<div class="sec">${esc(g)} ${fs.length}</div>` + fs.map(cardHTML).join(''); });
    } else if(!ranked.length) h += `<div class="sec">순위 맛집 0</div><div class="empty">맛집 카드 오른쪽의 👑🥈🥉 버튼으로 순위를 매겨 보세요.</div>`;

listEl.addEventListener('click',e=>{

function select(id, fromMap){
  state.sel=id;

  renderList(); refreshMarkers();
  if(!id){ clearOverlays(); renderBar(); return; }

      const up=()=>{ const tb=listEl.querySelector(`[data-near="${p.id}"]`); if(tb&&state.sel===p.id) tb.innerHTML=nearTable(p); };
      if(hs.length){ walkMatrix(hs,[p]).then(up); hs.forEach(h=>transitQuery(h,p).then(up)); } }
  }
  renderBar();
  const el=listEl.querySelector(`[data-id="${id}"]`); if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});

function setRoute(a,b){
  state.from=a||''; state.to=b||''; state.mode=null;
  fromSel.value=state.from; toSel.value=state.to;
  const A=byId[state.from], B=byId[state.to];
  if(A&&B&&A.city===B.city&&A.city!==state.city){ state.city=A.city; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.city===A.city)); renderList(); }
  refreshMarkers();
  renderRoute();
  try{ history.replaceState(null,'', state.from||state.to ? `#from=${state.from}&to=${state.to}` : location.pathname); }catch(e){}
  if(a && b) document.getElementById('scroll').scrollTo({top:0,behavior:'smooth'});
}
async function renderRoute(){
  const a=byId[state.from], b=byId[state.to];
  if(!a||!b||a.id===b.id){
    if(view.kind==='embed') showEmbed(null);
    resEl.innerHTML = !a&&!b ? '' : a&&b ? '<p class="note">출발지와 도착지가 같아요.</p>' : '<p class="note">출발지와 도착지를 모두 고르세요. 숙소·가게 카드의 표 행을 눌러도 바로 경로가 나와요.</p>';
    newGen();
    if(state.sel && byId[state.sel].type==='hotel') showHotelRanks(byId[state.sel]);
    else { if(map) clearOverlays(); renderBar(); }
    return;
  }
  const seq=newGen(), k=`${a.id}|${b.id}`;
  if(view.kind==='embed') showEmbed(null);
  const decideAuto = ()=>{ if(!state.modeAuto) return; const w=WALK[k], wm=w&&Number.isFinite(w.min)?w.min:null, t=trBest(k);
    if(wm!=null && wm<=12) state.mode='walk';
    else if(t && !t.walkOnly && (wm==null || t.min<wm)) state.mode='transit';
    else if(wm!=null && t) state.mode='walk'; };
  if(!state.mode){ state.modeAuto=true; state.mode='transit'; state.alt=0; decideAuto(); }
  const links=`<div class="links"><a class="btn small primary" target="_blank" rel="noopener" href="${gdir(a,b,'transit')}">구글 지도 앱으로 지금 출발 (다음 열차·지연)</a><a class="btn small" target="_blank" rel="noopener" href="${gdir(a,b,'walking')}">도보 경로 열기</a></div>`;
  const draw = ()=>{
    if(seq!==gen) return;
    const w=WALK[k], t=TR[k], tb=t&&t.status==='ok'&&t.routes.length ? t.routes[Math.min(state.alt||0,t.routes.length-1)] : null;
    let h='<div class="modes">';
    h+=`<button class="mode" data-mode="walk" aria-pressed="${state.mode==='walk'}"><small>🚶 도보</small><b>${w&&Number.isFinite(w.min)?fmtMin(w.min):(w&&w.err?'—':'계산 중…')}</b><small>${w&&w.m?fmtDist(w.m):(w&&w.err?esc(w.err):'')}</small></button>`;
    h+=`<button class="mode" data-mode="transit" aria-pressed="${state.mode==='transit'}"><small>🚇 지하철+도보</small><b>${tb?(tb.walkOnly?'도보 추천':fmtMin(tb.min)):(t&&t.status==='error'?'—':'조회 중…')}</b><small>${tb&&!tb.walkOnly?(tb.fare!=null?'¥'+tb.fare.toLocaleString():'요금 미확인')+(tb.transfers?` · 환승 ${tb.transfers}`:''):(t&&t.status==='error'?'조회 실패':'')}</small></button>`;
    h+='</div>';
    if(state.mode==='transit'){
      if(!t || t.status==='loading') h+='<p class="note">NAVITIME에서 경로를 찾는 중…</p>';
      else if(t.status==='error') h+=`<div class="warn">지하철 경로를 불러오지 못했어요 (${esc(t.msg)}). 아래 구글 지도 앱 버튼으로 확인하세요.</div>`;
      else {
        const rs=t.routes; const i=Math.min(state.alt||0, rs.length-1); const r=rs[i];
        if(rs.length>1) h+=`<div class="modes" style="flex-wrap:wrap">${rs.map((x,j)=>`<button class="mode" data-alt="${j}" aria-pressed="${j===i}" style="flex:1 1 30%"><small>경로 ${j+1}${x.walkOnly?' · 도보':''}</small><b style="font-size:15px">${fmtMin(x.min)}</b><small>${x.fare!=null?'¥'+x.fare.toLocaleString():(x.walkOnly?'요금 없음':'요금 미확인')}${x.transfers?` · 환승 ${x.transfers}`:''}</small></button>`).join('')}</div>`;
        if(r.longWalk) h+='<div class="warn" style="margin-bottom:8px">이 경로에 20분 넘게 걷는 구간이 있어요. NAVITIME 무료 API는 <b>버스를 넣지 않고</b> 계산해서, 실제로는 버스·택시·숙소 송영이 더 나을 수 있어요. 구글 지도 앱으로도 확인하세요.</div>';
        h+='<ol class="steps">'+r.steps.map((s,j)=>{
          if(s.kind==='walk') return `<li class="step"><span class="ic">🚶</span><div>${s.fromGate?`<b>${esc(s.fromGate)}</b>로 나와서 `:''}${esc(s.to==='도착지'?b.name:s.to)}${s.gate?` <b>${esc(s.gate)}</b>`:''}까지 걷기<div class="meta">${fmtMin(s.min)} · ${fmtDist(s.m)}</div></div></li>`;
          return `<li class="step"><span class="ic" style="background:${esc(s.color)}22">🚇</span><div><span class="badge" style="background:${esc(s.color)}">${lineLabel(s.line).replace(/<span class="meta">/,'<span style="opacity:.85;font-weight:500">')}</span><div style="margin-top:4px"><b>${esc(s.from)}</b>${s.fromNo?` <span class="meta">${esc(s.fromNo)}</span>`:''} 승차 → <b>${esc(s.to)}</b>${s.toNo?` <span class="meta">${esc(s.toNo)}</span>`:''} 하차</div><div class="meta">${fmtMin(s.min)}${s.dir?` · ${esc(s.dir)} 방면`:''}${s.type&&s.type!=='普通'?` · ${esc(s.type)}`:''}</div></div></li>`;
        }).join('')+'</ol>';
        h+=`<p class="note">총 ${fmtMin(r.min)} · 운임 ${r.fare!=null?'¥'+r.fare.toLocaleString():'미확인'}${r.ic!=null&&r.ic!==r.fare?` (IC카드 ¥${r.ic.toLocaleString()})`:''} · 걷는 거리 ${fmtDist(r.walkM)}<br>출처: NAVITIME 경로 탐색 (${esc(fmtAt(t.at))} 조회). 철도 시간은 시간표가 아닌 <b>평균 소요시간</b> 기준이고 버스는 포함되지 않아요. 다음 열차 시각·지연은 아래 구글 지도 앱 버튼으로 확인하세요.</p>`;
      }
    } else if(w && Number.isFinite(w.min)){
      h+=`<ol class="steps"><li class="step"><span class="ic">🚶</span><div>${esc(b.name)}까지 걷기<div class="meta">${fmtMin(w.min)} · ${fmtDist(w.m)}</div></div></li></ol><p class="note">도보: Google Routes API 실시간 계산 (${esc(fmtAt(w.at))}). 지도에 초록 선으로 표시했어요.</p>`;
    } else if(w && w.err){ h+=`<div class="warn">도보 경로를 계산하지 못했어요 (${esc(w.err)}).</div>`; }
    h+=links;
    resEl.innerHTML=h;
    resEl.querySelectorAll('.mode[data-mode]').forEach(m=>m.onclick=()=>{ state.mode=m.dataset.mode; state.modeAuto=false; renderRoute(); });
    resEl.querySelectorAll('.mode[data-alt]').forEach(m=>m.onclick=()=>{ state.alt=+m.dataset.alt; state.modeAuto=false; draw(); drawMap(); });
  };
  const drawMap = async ()=>{
    if(seq!==gen || !map) return;
    const tok=++mapTok, mode=state.mode, ok=()=>seq===gen && tok===mapTok && state.mode===mode;
    if(state.mode==='walk'){
      try{ const v=await walkRoute(a,b); if(!ok()) return; draw();

        overlays.push(new google.maps.Polyline({map, path, strokeColor:'#11875d', strokeOpacity:.95, strokeWeight:5, zIndex:3}));
        const bb=new google.maps.LatLngBounds(); path.forEach(x=>bb.extend(x)); map.fitBounds(bb,60); renderBar();
      }catch(err){ if(!ok()) return; WALK[k]={err:String(err.message||err)}; draw(); }
      return;
    }
    await transitQuery(a,b,{shape:true}); if(!ok()) return; draw();
    clearOverlays();
    const shapes=TRSHAPE[k], i=Math.min(state.alt||0,((TR[k]&&TR[k].routes)||[1]).length-1), fc=shapes&&shapes[i];
    const bb=new google.maps.LatLngBounds(); bb.extend({lat:a.lat,lng:a.lng}); bb.extend({lat:b.lat,lng:b.lng});
    if(fc && Array.isArray(fc.features)){
      fc.features.forEach(f=>{ const g=f.geometry; if(!g) return; const lines = g.type==='LineString'?[g.coordinates]: g.type==='MultiLineString'?g.coordinates:[];
        const pr=f.properties||{}, walk=pr.ways==='walk', col=(pr.inline&&pr.inline.color)||'#555';
        lines.forEach(cs=>{ const path=cs.map(c=>({lat:c[1],lng:c[0]})); path.forEach(x=>bb.extend(x));
          overlays.push(walk ? new google.maps.Polyline({map, path, strokeOpacity:0, icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,strokeColor:'#11875d',strokeWeight:3,scale:2},offset:'0',repeat:'9px'}], zIndex:3})
                             : new google.maps.Polyline({map, path, strokeColor:col==='#D3D3D3'?'#555':col, strokeOpacity:.95, strokeWeight:6, zIndex:4})); }); });
    } else {
      overlays.push(new google.maps.Polyline({map, path:[{lat:a.lat,lng:a.lng},{lat:b.lat,lng:b.lng}], strokeColor:'#555', strokeOpacity:.5, strokeWeight:3}));
    }
    map.fitBounds(bb,60); renderBar();
  };
  draw();
  const after = ()=>{ if(seq!==gen) return; const before=state.mode; decideAuto(); if(state.mode!==before){ drawMap(); } draw(); };
  if(!WALK[k] || WALK[k].err) walkMatrix([a],[b]).then(after);
  transitQuery(a,b,{shape:true}).then(after);   // 경로+지도 도형을 한 번에 (요청 1회)
  drawMap();
}

/* ---------- 장소 추가·삭제 (이 기기에 저장) ---------- */
function rebuildPlaces(){
  const removed=new Set(lsGet('removed',[]));
  const shipped=new Set(BASE.map(p=>p.gpid).filter(Boolean));
  let added=lsGet('added',[]).filter(x=>x&&x.id&&Number.isFinite(x.lat)&&Number.isFinite(x.lng));
  if(added.some(x=>x.gpid&&shipped.has(x.gpid))){ added=added.filter(x=>!(x.gpid&&shipped.has(x.gpid))); lsSet('added',added); }
  P.length=0; BASE.forEach(p=>{ if(!removed.has(p.id)) P.push(p); }); added.forEach(p=>{ if(!removed.has(p.id)) P.push(p); });
  for(const k in byId) delete byId[k]; P.forEach(p=>byId[p.id]=p);
}
function syncMarkers(){
  if(!map) return;
  P.forEach(p=>{ if(markers[p.id]) return; const el=document.createElement('div');
    const m = new google.maps.marker.AdvancedMarkerElement({map, position:{lat:p.lat,lng:p.lng}, content:el, title:p.name, gmpClickable:true});
    m.addListener('click', ()=>select(p.id===state.sel?null:p.id, true));
    markers[p.id]={m,el}; });
  for(const id in markers) if(!byId[id]){ markers[id].m.map=null; delete markers[id]; }
}
function afterPlacesChanged(){
  rebuildPlaces(); syncMarkers(); fillSelects();
  if(state.sel && !byId[state.sel]) state.sel=null;
  if((state.from && !byId[state.from]) || (state.to && !byId[state.to])) setRoute(byId[state.from]?state.from:'', byId[state.to]?state.to:'');
  renderList(); refreshMarkers();
}

function openModal(html){ closeModal(); modalEl=document.createElement('div'); modalEl.className='modal-bg'; modalEl.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  modalEl.addEventListener('click',e=>{ if(e.target===modalEl) closeModal(); }); document.body.appendChild(modalEl); return modalEl; }
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; } document.removeEventListener('keydown', escClose); }
function escClose(e){ if(e.key==='Escape') closeModal(); }
const icoHTML = p => p.type==='hotel' ? `<span style="color:var(--hotel)">${BED}</span>` : (p.emoji||(p.type==='spot'?'📍':'🍴'));
const thumbOrIco = (p,cls) => { const t=THUMB[p.id]; return t&&t.photo ? `<img class="thumb" style="width:40px;height:40px;border-radius:10px" alt="" loading="lazy" src="${photoURL(t.photo,120)}">` : `<span class="${cls||'mico'}">${icoHTML(p)}</span>`; };

/* 삭제 모달 — 저장 전까지는 표시만 하고, 저장하면 반영 / 취소하면 원래대로 */
function openDeleteModal(){
  const removed0=new Set(lsGet('removed',[]));
  const staged=new Set();      // 이번에 삭제 표시한 것
  const restore=new Set();     // 이번에 복원 표시한 것 (예전에 지운 것)
  let tab='food';
  const all = ()=>[...BASE, ...lsGet('added',[])];
  const draw = ()=>{
    const live = all().filter(p=>p.type===tab && !removed0.has(p.id));
    const gone = all().filter(p=>p.type===tab && removed0.has(p.id));
    const cnt = staged.size + restore.size;
    const body = live.length ? live.map(p=>{ const on=staged.has(p.id);
        return `<div class="mrow${on?' gone':''}">${thumbOrIco(p)}<div class="mi"><div class="mn">${esc(p.name)}</div><div class="meta">${esc(CITY[p.city]?CITY[p.city].name:'')} · ${esc(p.area||p.address||'')}</div></div>${on?`<button class="minus undo" data-undo="${esc(p.id)}">되돌리기</button>`:`<button class="minus" data-del="${esc(p.id)}" aria-label="${esc(p.name)} 삭제" title="삭제">−</button>`}</div>`; }).join('')
      : `<div class="empty">${TYPE_LABEL[tab]}이(가) 없어요.</div>`;
    const goneHTML = gone.length ? `<div class="sub-h">삭제한 ${TYPE_LABEL[tab]} ${gone.length}</div>`+gone.map(p=>{ const on=restore.has(p.id);
        return `<div class="mrow${on?'':' gone'}">${thumbOrIco(p)}<div class="mi"><div class="mn">${esc(p.name)}</div><div class="meta">${on?'저장하면 다시 표시돼요':'삭제됨'}</div></div>${on?`<button class="minus undo" data-unrestore="${esc(p.id)}">취소</button>`:`<button class="plus" data-restore="${esc(p.id)}" aria-label="${esc(p.name)} 복원" title="복원">+</button>`}</div>`; }).join('') : '';
    modalEl.querySelector('.modal').innerHTML = `
      <div class="modal-h"><h2>장소 삭제</h2><p>− 를 눌러 지울 장소를 고르고 <b>저장</b>을 누르세요. 취소하면 아무것도 바뀌지 않아요.</p>
        <div class="seg">${['food','hotel','spot'].map(t=>`<button data-tab="${t}" aria-pressed="${t===tab}">${TYPE_LABEL[t]} ${all().filter(p=>p.type===t&&!removed0.has(p.id)).length}</button>`).join('')}</div></div>
      <div class="modal-b">${body}${goneHTML}</div>
      <div class="modal-f"><span class="meta">${cnt?`변경 ${cnt}건`:'변경 없음'}</span><button class="btn" data-cancel>취소</button><button class="btn primary" data-save ${cnt?'':'disabled'}>저장</button></div>`;
  };
  openModal(''); document.addEventListener('keydown', escClose);
  modalEl.addEventListener('click',e=>{
    const t=e.target.closest('button'); if(!t) return;
    if(t.dataset.tab){ tab=t.dataset.tab; draw(); return; }
    if(t.dataset.del){ staged.add(t.dataset.del); draw(); return; }
    if(t.dataset.undo){ staged.delete(t.dataset.undo); draw(); return; }
    if(t.dataset.restore){ restore.add(t.dataset.restore); draw(); return; }
    if(t.dataset.unrestore){ restore.delete(t.dataset.unrestore); draw(); return; }
    if('cancel' in t.dataset){ closeModal(); return; }
    if('save' in t.dataset){
      const rm=new Set(lsGet('removed',[])); staged.forEach(id=>rm.add(id)); restore.forEach(id=>rm.delete(id));
      // 직접 추가했던 장소는 목록에서 완전히 지움
      const addedIds=new Set(lsGet('added',[]).map(x=>x.id)); const dropAdded=[...staged].filter(id=>addedIds.has(id));
      if(dropAdded.length){ lsSet('added', lsGet('added',[]).filter(x=>!dropAdded.includes(x.id))); dropAdded.forEach(id=>rm.delete(id)); }
      lsSet('removed',[...rm]);
      const nm=id=>{ const p=all().find(x=>x.id===id); return p?p.name:id; };
      if(staged.size) pushLocalEvent({type:'deleted', names:[...staged].map(nm)});
      if(restore.size) pushLocalEvent({type:'restored', names:[...restore].map(nm)});
      closeModal(); afterPlacesChanged(); return;
    }
  });
  draw();
}

/* 추가 모달 — 입력한 글(가게 이름·지역·설명·구글 지도 링크)을 Google 장소 검색으로 분석해 후보를 보여주고, 고르면 추가 */
const KANSAI = {rectangle:{low:{latitude:34.40,longitude:135.10},high:{latitude:35.25,longitude:136.05}}};
function cityOf(lat,lng){ if(lng>135.76 && lat<34.80) return 'nara'; if(lat>34.86) return 'kyoto'; return 'osaka'; }
const TYPE_EMOJI = [['ramen','🍜'],['sushi','🍣'],['yakiniku','🥩'],['barbecue','🥩'],['steak','🥩'],['japanese_restaurant','🍱'],['noodle','🍜'],['udon','🍜'],['soba','🍜'],['cafe','☕'],['coffee','☕'],['bakery','🥐'],['dessert','🍰'],['pizza','🍕'],['italian','🍝'],['bar','🍶'],['izakaya','🍶'],['seafood','🐟'],['tonkatsu','🍖'],['chinese','🥟'],['korean','🍲'],['hotel','🛏'],['lodging','🛏'],['shrine','⛩'],['temple','⛩'],['museum','🏛'],['park','🌳'],['tourist_attraction','📸'],['market','🛍'],['shopping','🛍']];
const emojiOf = types => { const s=(types||[]).join(' '); for(const [k,e] of TYPE_EMOJI) if(s.includes(k)) return e; return ''; };
function parseInput(text){
  let q=text.trim(), coord=null; const urls=q.match(/https?:\/\/\S+/g)||[];
  for(const u of urls){
    let d=u; try{ d=decodeURIComponent(u); }catch(e){}
    const m3=d.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || d.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || d.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
    if(m3) coord={lat:+m3[1],lng:+m3[2]};
    const mp=d.match(/\/maps\/place\/([^/@?]+)/); if(mp) q=q.replace(u, ' '+mp[1].replace(/\+/g,' ')+' ');
    else { const mq=d.match(/[?&](?:q|query)=([^&]+)/); if(mq && !/^-?\d+\.\d+,/.test(mq[1])) q=q.replace(u,' '+mq[1].replace(/\+/g,' ')+' '); else q=q.replace(u,' '); }
  }
  return {q:q.replace(/\s+/g,' ').trim(), coord, hadUrl:urls.length>0, onlyShortUrl: urls.length>0 && !coord && !q.replace(/\s+/g,'').length};
}
async function placesSearch(query, bias, lang){
  const body={textQuery:query, languageCode:lang||'ko', regionCode:'JP', pageSize:5};
  body.locationBias = bias ? {circle:{center:{latitude:bias.lat,longitude:bias.lng},radius:500}} : KANSAI;
  const j=await gpost('https://places.googleapis.com/v1/places:searchText','places.id,places.displayName,places.formattedAddress,places.location,places.types,places.primaryType,places.primaryTypeDisplayName,places.rating,places.userRatingCount,places.photos.name,places.googleMapsUri', body);
  return j.places||[];
}
const BRIDGE='http://127.0.0.1:8777';
async function bridge(path, body){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), path==='/health'?2500:20000);
  try{ const r=await fetch(BRIDGE+path, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal}:{signal:ctl.signal});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j; } finally{ clearTimeout(t); }
}
const LEVEL = {both:['✅ Claude·Codex 둘 다 같은 곳','#1b7f3b'], one:['⚠️ AI 한쪽만 찾음','#b26a00'], mismatch:['❌ 이름 불일치 (추가 불가)','#b3261e']};

/* ---------- 알림 ---------- */
const NOTI = {bridgeOk:null, events:(window.EVENTS||[]).slice(), running:[], timer:null};
const localEvents = ()=>lsGet('localEvents',[]);
function pushLocalEvent(e){ const l=localEvents(); l.push({id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), at:new Date().toISOString(), ...e}); lsSet('localEvents', l.slice(-200)); renderBell(); }
function allEvents(){ const m=new Map(); [...NOTI.events, ...localEvents()].forEach(e=>e&&e.id&&m.set(e.id,e)); return [...m.values()].sort((a,b)=>Date.parse(b.at)-Date.parse(a.at)); }
function unreadCount(){ const seen=Date.parse(lsGet('notifSeen','1970-01-01T00:00:00Z'))||0; return allEvents().filter(e=>(Date.parse(e.at)||0)>seen).length; }
function renderBell(){
  const b=document.getElementById('btnBell'); if(!b) return;
  const n=unreadCount(), run=NOTI.running.length;
  b.querySelector('.badge').textContent = run ? '⋯' : (n>99?'99+':n||'');
  b.querySelector('.badge').hidden = !(n||run);
  b.classList.toggle('running', !!run);
  b.title = run ? `AI 분석 중 ${run}건` : n ? `새 알림 ${n}건` : '알림';
  if(modalEl && modalEl.dataset.kind==='notif') drawNotif();
}
let knownAdded = new Set(lsGet('knownAdded',[]));
async function pollBridge(){
  try{
    const j=await bridge('/events'); NOTI.bridgeOk=true; lsSet('bridgeUsed',true);
    const before=new Set(NOTI.events.map(e=>e.id));
    NOTI.events=j.events||[]; NOTI.running=j.running||[];
    const fresh=NOTI.events.filter(e=>!before.has(e.id) && e.type==='added');
    if(fresh.length || NOTI.events.some(e=>e.type==='added' && e.places && e.places.some(p=>!byId[p.id] && !knownAdded.has(p.gpid)))){
      // 새로 추가된 장소를 배포 전에도 바로 리스트에 표시
      const a=(await bridge('/added')).added||[]; const loc=lsGet('added',[]); const have=new Set([...BASE.map(p=>p.gpid), ...loc.map(p=>p.gpid)]);
      let ch=false; a.forEach(p=>{ if(p.gpid && !have.has(p.gpid)){ loc.push({...p, pending:true}); ch=true; } knownAdded.add(p.gpid); });
      lsSet('knownAdded',[...knownAdded]); if(ch){ lsSet('added',loc); afterPlacesChanged(); }
    }
  }catch(err){ NOTI.bridgeOk=false; NOTI.running=[]; }
  renderBell();
  clearTimeout(NOTI.timer); NOTI.timer=setTimeout(pollBridge, NOTI.running.length?3000:(NOTI.bridgeOk?20000:120000));
}
let notifTab='all';
function evHTML(e){
  const when=new Date(e.at); const t=isNaN(when)?'':when.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const seen=Date.parse(lsGet('notifSeen','1970-01-01T00:00:00Z'))||0, isNew=(Date.parse(e.at)||0)>seen;
  const head=(ic,label,color)=>`<div style="display:flex;gap:8px;align-items:center"><b style="color:${color}">${ic} ${label}</b><span class="meta">${t}${e.cat?' · '+TYPE_LABEL[e.cat]:''}</span>${isNew?'<span class="newdot">새</span>':''}</div>`;
  const memo = e.text?`<div class="meta" style="margin-top:2px">입력: “${esc(e.text)}”</div>`:'';
  if(e.type==='added') return `<div class="nrow">${head('✅','추가됨','#1b7f3b')}${(e.places||[]).map(p=>`<button class="nlink" data-goto="${esc(p.id)}">${esc(p.name)}${p.nameJa&&p.nameJa!==p.name?` <span class="meta">${esc(p.nameJa)}</span>`:''} · ${esc(CITY[p.city]?CITY[p.city].name:'')}</button>`).join('')}${memo}${e.note?`<div class="meta">${esc(e.note)}</div>`:''}</div>`;
  if(e.type==='deleted'||e.type==='restored') return `<div class="nrow">${head(e.type==='deleted'?'🗑':'↩',e.type==='deleted'?'삭제함 (이 기기)':'복원함 (이 기기)','#555')}<div class="meta">${(e.names||[]).map(esc).join(', ')}</div></div>`;
  // failed / duplicate
  const res=new Set(e.resolved||[]);
  const cands=(e.cands||[]).map((c,i)=>{ const L=LEVEL[c.level]||['','#555'];
    const evid=(c.ai||[]).map(a=>`<div style="margin-top:3px"><b>${esc(a.ai)}</b>: ${esc(a.evidence||'')}</div>`).join('');
    const canAdd = NOTI.bridgeOk && c.level!=='mismatch' && !res.has(c.pid) && !BASE.concat(lsGet('added',[])).some(p=>p.gpid===c.pid);
    return `<div class="cand" style="align-items:flex-start;margin-top:6px">${c.photo?`<img class="thumb" alt="" src="${photoURL(c.photo,160)}">`:`<span class="mico">${emojiOf(c.types)||'📍'}</span>`}<div class="mi">
      <div style="font-size:12px;font-weight:800;color:${L[1]}">${L[0]}</div><div class="mn">${esc(c.name)}${c.nameJa&&c.nameJa!==c.name?` <span class="meta">${esc(c.nameJa)}</span>`:''}</div>
      <div class="meta">${esc(c.typeKo||'')}${c.rating?` · ⭐ ${(+c.rating).toFixed(1)}`:''}${c.status&&c.status!=='OPERATIONAL'?` · <b style="color:#b3261e">${c.status==='CLOSED_PERMANENTLY'?'폐업':'휴업'}</b>`:''}<br>${esc(c.address||'')}${c.mapsUri?` · <a href="${esc(c.mapsUri)}" target="_blank" rel="noopener">지도에서 확인</a>`:''}</div>
      ${evid?`<details class="meta" style="margin-top:4px"><summary>AI 근거</summary>${evid}</details>`:''}</div>
      ${res.has(c.pid)?'<span class="meta" style="color:#1b7f3b">추가함</span>':canAdd?`<button class="btn small" data-force="${esc(e.id)}|${i}">그래도 추가</button>`:''}</div>`; }).join('');
  const un=(e.unresolved||[]).length?`<div class="meta" style="margin-top:4px">Google 지도에서 확인 안 됨: ${(e.unresolved).map(u=>esc(`${u.ai} → ${u.name_ja||u.name_ko}`)).join(', ')}</div>`:'';
  return `<div class="nrow">${head(e.type==='duplicate'?'ℹ️':'❌', e.type==='duplicate'?'이미 있음':'추가 실패', e.type==='duplicate'?'#555':'#b3261e')}${memo}<div class="meta" style="margin-top:2px">${esc(e.reason||'')}</div>${cands}${un}</div>`;
}
function drawNotif(){
  const ev=allEvents();
  const cat = e => e.type==='added'?'added' : (e.type==='deleted'||e.type==='restored')?'deleted' : 'failed';
  const cnt = k => k==='all'?ev.length:ev.filter(e=>cat(e)===k).length;
  const list = ev.filter(e=>notifTab==='all'||cat(e)===notifTab);
  const run = NOTI.running.map(r=>`<div class="nrow"><b style="color:#1a5fb4">⏳ AI 분석 중</b> <span class="meta">${TYPE_LABEL[r.cat]||''}</span><div class="meta">입력: “${esc(r.text)}”</div><div class="meta">${Object.entries(r.steps||{}).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(' · ')||'시작함'}</div></div>`).join('');
  modalEl.querySelector('.modal').innerHTML = `
    <div class="modal-h"><h2>알림</h2><p>${NOTI.bridgeOk?'🤖 AI 연결됨 (이 PC)':NOTI.bridgeOk===false?'🤖 AI 꺼짐 — 추가 결과는 GitHub 반영 후(1~2분) 보여요':'추가·실패 알림은 AI를 실행한 PC에서 올린 기록이에요 (반영까지 1~2분)'}</p>
      <div class="seg">${[['all','전체'],['added','추가'],['failed','실패'],['deleted','삭제']].map(([k,l])=>`<button data-ntab="${k}" aria-pressed="${k===notifTab}">${l} ${cnt(k)}</button>`).join('')}</div></div>
    <div class="modal-b">${run}${list.length?list.map(evHTML).join(''):(run?'':'<div class="empty">알림이 없어요.</div>')}</div>
    <div class="modal-f"><span class="meta"></span><button class="btn" data-cancel>닫기</button></div>`;
}
function openNotif(){
  notifTab='all'; openModal(''); modalEl.dataset.kind='notif'; document.addEventListener('keydown', escClose);
  drawNotif();
  setTimeout(()=>{ lsSet('notifSeen', new Date().toISOString()); renderBell(); }, 1500);
  modalEl.addEventListener('click', async e=>{
    const t=e.target.closest('button'); if(!t) return;
    if('cancel' in t.dataset){ closeModal(); return; }
    if(t.dataset.ntab){ notifTab=t.dataset.ntab; drawNotif(); return; }
    if(t.dataset.goto){ const id=t.dataset.goto, p=byId[id]; closeModal(); if(p){ setCity(p.city,true); select(id,false); } return; }
    if(t.dataset.force){ const [eid,idx]=t.dataset.force.split('|'); t.disabled=true; t.textContent='추가 중…';
      try{ await bridge('/force',{event:eid, idx:+idx}); await pollBridge(); }catch(err){ t.textContent='실패: '+(err.message||err); } return; }
  });
}
document.getElementById('btnBell').onclick=openNotif;

      t.disabled=true;
      try{ await bridge('/analyze',{text:input,cat});
        status='✅ AI가 찾기 시작했어요. 끝나면 자동으로 리스트에 추가되고 🔔 알림으로 알려드려요. (20초~1분) 창을 닫아도 계속 진행돼요.'; input='';
        draw(); pollBridge(); setTimeout(()=>{ if(modalEl&&modalEl.dataset.kind==='add') closeModal(); }, 2200);
      }catch(err){ status='AI 연결 실패: '+esc(err.message||err); t.disabled=false; draw(); }
      return;
    }
    if('plain' in t.dataset){
      input=modalEl.querySelector('#addText').value; cat=modalEl.querySelector('#addCat').value;
      const pi=parseInput(input); if(!pi.q&&!pi.coord){ status='장소 정보를 입력해 주세요.'; draw(); return; }
      status='Google 지도에서 찾는 중…'; draw();
      try{ const res=await placesSearch(pi.q||`${pi.coord.lat},${pi.coord.lng}`, pi.coord); const all=[...BASE,...lsGet('added',[])];
        cands=res.filter(c=>c.location).map(c=>({pid:c.id, name:c.displayName&&c.displayName.text, address:c.formattedAddress, lat:c.location.latitude, lng:c.location.longitude, types:c.types, typeKo:c.primaryTypeDisplayName&&c.primaryTypeDisplayName.text, rating:c.rating, photo:c.photos&&c.photos[0]&&c.photos[0].name, mapsUri:c.googleMapsUri}));
        cands.forEach(c=>c._exists=all.some(p=>(p.gpid&&p.gpid===c.pid)||haversine(p,{lat:c.lat,lng:c.lng})<25));
        status=cands.length?'AI 없이 Google 검색 결과예요. 맞는 곳의 + 를 누르면 이 기기에만 추가돼요.':'Google 지도에서 찾지 못했어요.'; }catch(err){ status='검색 실패: '+esc(err.message||err); }
      draw(); return;
    }
    if(t.dataset.pick){
      const c=cands[+t.dataset.pick]; if(!c) return; t.disabled=true;
      let ja=null; try{ ja=await gpost(`https://places.googleapis.com/v1/places/${encodeURIComponent(c.pid)}?languageCode=ja`,'displayName,formattedAddress',undefined,'GET'); }catch(err){}
      const p={id:'u-'+c.pid.slice(-12)+'-'+Date.now().toString(36), gpid:c.pid, type:cat, city:cityOf(c.lat,c.lng), lat:c.lat, lng:c.lng, name:c.name||'이름 없음', nameJa:(ja&&ja.displayName&&ja.displayName.text)||'', address:(ja&&ja.formattedAddress)||c.address||'', area:c.typeKo||'', group:cat==='food'?'직접 추가한 맛집':(cat==='spot'?'관광지':''), emoji:cat==='hotel'?'':(emojiOf(c.types)||(cat==='spot'?'📍':'🍴')), origin:'added', typed:input.slice(0,300), notes:[]};
      const added=lsGet('added',[]); added.push(p); lsSet('added',added);
      pushLocalEvent({type:'added', cat, text:input.slice(0,300), places:[{id:p.id,name:p.name,nameJa:p.nameJa,city:p.city}], note:'AI 없이 구글 검색으로 추가 (이 기기에만)'});
      closeModal(); afterPlacesChanged(); setCity(p.city,true); select(p.id,false); return;
    }
  });
  draw();
}
document.getElementById('btnAdd').onclick=openAddModal;
document.getElementById('btnDel').onclick=openDeleteModal;

/* ---------- 리스트 썸네일 (Google 지도 사진) ---------- */
const THUMB = lsGet('thumbs',{});   // id -> {pid, photo, at}  (Place ID는 장기 보관 가능, 사진 이름은 3일만)
const PHOTO_TTL = 3*24*3600e3;
for(const k in THUMB){ if(!THUMB[k].at || Date.now()-Date.parse(THUMB[k].at)>PHOTO_TTL) THUMB[k]={pid:THUMB[k].pid, at:null}; }
const photoURL = (name,w) => `https://places.googleapis.com/v1/${name}/media?maxWidthPx=${w}&maxHeightPx=${w}&key=${GKEY}`;
const thumbQ=[]; let thumbActive=0; const thumbBusy=new Set();
function pumpThumb(){ while(thumbActive<3 && thumbQ.length){ const p=thumbQ.shift(); thumbActive++; fetchThumb(p).finally(()=>{ thumbActive--; pumpThumb(); }); } }
async function fetchThumb(p){
  try{
    const t=THUMB[p.id]||{};
    let photo=null, pid=t.pid||p.gpid||null;
    if(pid){ const r=await gpost(`https://places.googleapis.com/v1/places/${encodeURIComponent(pid)}`,'photos.name',undefined,'GET'); photo=r.photos&&r.photos[0]&&r.photos[0].name; }
    else {
      const j=await gpost('https://places.googleapis.com/v1/places:searchText','places.id,places.location,places.photos.name',
        {textQuery:`${p.nameJa||p.name} ${p.address||''}`, regionCode:'JP', pageSize:3, locationBias:{circle:{center:{latitude:p.lat,longitude:p.lng},radius:300}}});
      const best=(j.places||[]).filter(x=>x.location).map(x=>({x,d:haversine(p,{lat:x.location.latitude,lng:x.location.longitude})})).sort((a,b)=>a.d-b.d).find(c=>c.d<=250);
      if(best){ pid=best.x.id; photo=best.x.photos&&best.x.photos[0]&&best.x.photos[0].name; }
    }
    THUMB[p.id]={pid:pid||'', photo:photo||'', at:new Date().toISOString()}; lsSet('thumbs',THUMB);
    paintThumb(p.id);
  }catch(err){ console.warn('thumb', err); }
}
function paintThumb(id){
  const t=THUMB[id]; if(!t||!t.photo) return;
  listEl.querySelectorAll(`.card[data-id="${CSS.escape(id)}"] .ico`).forEach(ico=>{ ico.classList.add('has-thumb'); ico.innerHTML=`<img class="thumb" alt="" loading="lazy" src="${photoURL(t.photo,160)}">`; });
}
const thumbIO = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; thumbIO.unobserve(e.target);
  const id=e.target.closest('.card').dataset.id, p=byId[id]; if(!p) return; const t=THUMB[id];
  if(t && t.at && Date.now()-Date.parse(t.at)<PHOTO_TTL){ paintThumb(id); return; }
  if(!thumbBusy.has(id)){ thumbBusy.add(id); thumbQ.push(p); pumpThumb(); } }), {root:document.getElementById('scroll'), rootMargin:'200px'}) : null;
function observeThumbs(){ if(!thumbIO) return; listEl.querySelectorAll('.card .ico').forEach(el=>{ const id=el.closest('.card').dataset.id; const t=THUMB[id];
  if(t&&t.photo&&t.at&&Date.now()-Date.parse(t.at)<PHOTO_TTL){ paintThumb(id); } else thumbIO.observe(el); }); }

/* ---------- init ---------- */
rebuildPlaces(); renderBell(); if(lsGet('bridgeUsed',false)) pollBridge();   // AI 브리지를 쓴 적 있는 기기(PC)만 연결 시도
fillSelects(); setCity('osaka');
const hp=new URLSearchParams(location.hash.slice(1));
if(hp.get('from')||hp.get('to')) setRoute(byId[hp.get('from')]?hp.get('from'):'', byId[hp.get('to')]?hp.get('to'):'');
const s=document.createElement('script');
s.src=`https://maps.googleapis.com/maps/api/js?key=${GKEY}&v=weekly&language=ko&region=JP&loading=async&callback=__initMap`;
s.async=true; s.onerror=()=>{ document.getElementById('gmap').innerHTML='<div class="mapmsg">Google 지도 스크립트를 불러오지 못했어요.</div>'; };
document.head.appendChild(s);
})();
</script>
